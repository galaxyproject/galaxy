- id: gitlab
  version: 0
  name: GitLab
  description: |
      Browse the projects of a GitLab instance and import files from them. Projects you have access
      to appear as folders, with their repository contents below. Public projects can be browsed
      without an access token.

      Exporting commits the file to the branch. A GitLab instance that hosts ARCs takes data
      another way, so use the ARC file source for those.

      Requires the ``arcfs-fsspec`` package to be installed on the Galaxy server.
  variables:
      base_url:
          label: GitLab URL (e.g. https://gitlab.com)
          type: string
          help: |
              The URL of the GitLab instance you are connecting to, including the protocol.
      writable:
          label: Allow Galaxy to export data to this GitLab instance?
          type: boolean
          optional: true
          default: false
          help: |
              Allow Galaxy to commit data to your projects. This requires an access token that
              can push code, and the file lands on the project's default branch as an ordinary
              commit, so that branch must not be protected against the token's user. GitLab
              protects the default branch by default. Exports are limited to 20 MB, because the
              file travels inside the commit request; an ARC file source has no such limit.
              Leave this off to browse and import only.
  secrets:
      token:
          label: GitLab Access Token
          optional: true
          help: |
              A personal access token. It is required to see private projects. Public ones can
              be browsed without one, though a token also removes the limit some servers place
              on how deep an anonymous listing can page.

              A classic token needs the "read_api" scope to browse, or "api" to export. That is
              the simplest thing that works.

              A fine-grained token needs "Project: Read" granted under "User", not only the
              permission of the same name under "Group and project". Listing the projects you
              can see is a user-level call, so the project-scoped permission alone is refused
              with "403 ... requires ... user permissions: [Project: Read]". Add
              "Repository: Read" for file contents, and for exports also "Code: Push" and
              "Commit: Create". Give the token access to all groups and projects you are a
              member of.
  configuration:
      type: gitlab
      base_url: "{{ variables.base_url }}"
      token: "{{ secrets.token }}"
      writable: "{{ variables.writable }}"
