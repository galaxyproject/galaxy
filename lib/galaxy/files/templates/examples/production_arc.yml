- id: arc
  version: 0
  name: ARC DataHUB
  description: |
      [ARCs](https://nfdi4plants.org/) (Annotated Research Contexts) are research data packages hosted
      as Git repositories on a DataPLANT DataHUB, a GitLab instance. This configuration lets you browse
      the ARCs you have access to and import their files into Galaxy. Public ARCs can be browsed
      without an access token.

      Requires the ``arcfs-fsspec`` package to be installed on the Galaxy server.
  variables:
      base_url:
          label: DataHUB URL (e.g. https://git.nfdi4plants.org)
          type: string
          help: |
              The URL of the DataHUB (GitLab) instance you are connecting to, including the protocol.
      writable:
          label: Allow Galaxy to export data to this DataHUB?
          type: boolean
          optional: true
          default: false
          help: |
              Allow Galaxy to write data to your ARCs. This requires an access token with write
              access. Exported files are not committed to the ARC's default branch. They go to a
              branch named after the access token, and the first export to an ARC opens a merge
              request for it, so an exported file appears in the ARC once a maintainer has merged
              that request. Later exports made with the same token are added to the same branch and
              the same merge request, so a token shared between people collects everybody's exports
              together.
  secrets:
      token:
          label: DataHUB Access Token
          optional: true
          help: |
              A personal access token for the DataHUB (GitLab) instance. It is required to see
              private ARCs and to export data; public ARCs can be browsed without one.

              A classic token needs the "api" scope, or "read_api" to browse only. That is the
              simplest thing that works.

              A fine-grained token needs "Project: Read" granted under "User", not only the
              permission of the same name under "Group and project". Listing the ARCs you can
              see is a user-level call, so the project-scoped permission alone is refused with
              "403 ... requires ... user permissions: [Project: Read]". Add "Repository: Read"
              for file contents, and for exports also "Code: Push" and "Create" on Branch,
              Commit and Merge Request. Give the token access to all groups and projects you
              are a member of.
  configuration:
      type: arc
      base_url: "{{ variables.base_url }}"
      token: "{{ secrets.token }}"
      writable: "{{ variables.writable }}"
