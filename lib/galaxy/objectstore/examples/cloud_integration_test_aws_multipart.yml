type: cloud
store_by: uuid
provider: aws
auth:
  access_key: ${GALAXY_TEST_AWS_ACCESS_KEY}
  secret_key: ${GALAXY_TEST_AWS_SECRET_KEY}
  region: ${GALAXY_TEST_AWS_REGION}

bucket:
  name: ${GALAXY_TEST_AWS_BUCKET}

# The 5 MiB provider minimum - a 12 MiB test file uploads as 3 parts.
transfer:
  multipart_threshold: 5242880
  multipart_chunksize: 5242880
  max_concurrency: 2

extra_dirs:
- type: job_work
  path: database/job_working_directory_cloud
- type: temp
  path: database/tmp_cloud
