type: cloud
provider: aws
auth:
  access_key: access_moo
  secret_key: secret_cow

bucket:
  name: unique_bucket_name_all_lowercase
  use_reduced_redundancy: false

# Multipart upload tuning, all sizes in bytes. Files larger than
# multipart_threshold are uploaded in multipart_chunksize parts, up to
# max_concurrency parts in parallel. multipart_chunksize must be at least
# 5 MiB (5242880), the provider minimum for all but the final part.
# Unset values fall back to cloudbridge's defaults (CB_MULTIPART_* settings).
# The aws and azure providers honor all three values; google and openstack
# upload large files through their SDKs' native mechanisms (resumable
# upload / static large objects), which manage their own chunking.
transfer:
  multipart_threshold: 5242880
  multipart_chunksize: 5242880
  max_concurrency: 2

cache:
  path: database/object_store_cache
  size: 1000

extra_dirs:
- type: job_work
  path: database/job_working_directory_cloud
- type: temp
  path: database/tmp_cloud
