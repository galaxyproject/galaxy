type: cloud
provider: azure
auth:
  subscription_id: a_sub_id
  client_id: and_a_client_id
  secret: and_a_secret_key
  tenant: and_some_tenant_info
  # Name the existing storage account and its resource group; without these
  # cloudbridge synthesizes a storage-account name, which is almost never
  # what a Galaxy deployment wants.
  storage_account: galaxystorage
  resource_group: galaxy_rg
  region: eastus2

bucket:
  name: unique_container_name
  use_reduced_redundancy: false

cache:
  path: database/object_store_cache
  size: 1000

extra_dirs:
- type: job_work
  path: database/job_working_directory_cloud
- type: temp
  path: database/tmp_cloud
