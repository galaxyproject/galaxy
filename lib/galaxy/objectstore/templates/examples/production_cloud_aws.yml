- id: cloud_aws_bucket
  version: 0
  name: Amazon Web Services S3 Storage (multi-cloud plugin)
  description: |
    Amazon's Simple Storage Service (S3) is Amazon's primary cloud storage service.
    More information on S3 can be found in [Amazon's documentation](https://aws.amazon.com/s3/).
    This form connects to S3 with Galaxy's multi-cloud storage plugin, which speaks to
    Amazon, Azure, Google Cloud and OpenStack alike.
  variables:
    bucket:
      label: Bucket
      type: string
      help: |
        The [AWS S3 Bucket](https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingBucket.html) to
        store your datasets in. You will need to create a bucket to use in your AWS web console before
        using this form.
    region:
      label: Region
      type: string
      default: us-east-1
      help: |
        The AWS region your bucket was created in, for instance `us-east-1` or `ap-southeast-2`. The
        region is shown beside the bucket in your AWS web console.
  secrets:
    access_key:
      label: Access Key ID
      help: |
        A security credential for interacting with AWS services can be created from your
        AWS web console. Creating an "Access Key" creates a pair of keys used to identify
        and authenticate access to your AWS account - the first part of the pair is the
        "Access Key ID" and should be entered here.
    secret_key:
      label: Secret Access Key
      help: |
        See the documentation above for "Access Key ID" for information about access key pairs.
  configuration:
    type: cloud
    provider: aws
    auth:
      access_key: '{{ secrets.access_key }}'
      secret_key: '{{ secrets.secret_key }}'
      region: '{{ variables.region }}'
    bucket:
      name: '{{ variables.bucket }}'
    transfer:
      multipart_threshold: 104857600
      multipart_chunksize: 52428800
      max_concurrency: 5
