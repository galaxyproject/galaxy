- doc: |
    Test to verify a multiple text parameter can be connected to a multiple data column param
  job:
    input:
      class: File
      path: 2.tabular
      filetype: tabular
    columns: ["1", "2"]
  outputs:
    output:
      class: File
      asserts:
        - that: has_text
          text: "col 1,2"
