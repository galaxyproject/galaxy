class: GalaxyWorkflow
doc: |
  A $(inputs.name) reference to an unconnected step input with a default, on a
  step that also has a when expression.
inputs:
  reads:
    type: data
  gate:
    type: boolean
    default: true
outputs:
  final_output:
    outputSource: process/out_file1
steps:
  process:
    tool_id: cat
    in:
      input1: reads
      gate: gate
      batch:
        default: b1
    when: $(inputs.gate)
    out:
      out_file1:
        rename: "$(inputs.batch)_processed"
