class: GalaxyWorkflow
doc: |
  $(inputs.name) references to an integer computed during the run, to an
  unconnected step input with a default, and to a connected optional parameter
  left unset.
inputs:
  reads:
    type: data
  lane_file:
    type: data
  suffix:
    type: text
    optional: true
outputs:
  final_output:
    outputSource: process/out_file1
steps:
  lane_param:
    tool_id: param_value_from_file
    in:
      input1: lane_file
    state:
      param_type: integer
  process:
    tool_id: cat
    in:
      input1: reads
      lane: lane_param/integer_param
      batch:
        default: b1
      suffix: suffix
    out:
      out_file1:
        rename: "$(inputs.batch)_L$(inputs.lane)$(inputs.suffix)"
