class: GalaxyWorkflow
inputs:
  input_collection:
    type: collection
    collection_type: list
outputs:
  picked:
    outputSource: pick/output
steps:
  branch:
    tool_id: cat
    in:
      input1:
        source: input_collection
  pick:
    type: pick_value
    in:
      input_0:
        source: branch/out_file1
    state:
      mode: first_or_skip
    out:
      output:
        set_columns:
          chromCol: 2
