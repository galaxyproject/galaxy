- doc: |
    Two elements are mapped over the subworkflow and three are connected to its
    collection input. The child remains one invocation, while its independent
    mapped step executes for every outer coordinate and produces a list:list.
  job:
    outer_mapping_source:
      class: Collection
      collection_type: list
      elements:
        - identifier: X
          class: File
          contents: "from_X"
        - identifier: Y
          class: File
          contents: "from_Y"
    inner_mapping_source:
      class: Collection
      collection_type: list
      elements:
        - identifier: P
          class: File
          contents: "P_content"
        - identifier: Q
          class: File
          contents: "Q_content"
        - identifier: R
          class: File
          contents: "R_content"
  outputs:
    inherited_mapping_output:
      class: Collection
      collection_type: list
      element_count: 2
      elements:
        X:
          asserts:
          - that: has_text
            text: "from_X"
        Y:
          asserts:
          - that: has_text
            text: "from_Y"
    local_mapping_output:
      class: Collection
      collection_type: list:list
      element_count: 2
      elements:
        X:
          class: Collection
          count: 3
          elements:
            P:
              asserts:
              - that: has_text
                text: "P_content"
            Q:
              asserts:
              - that: has_text
                text: "Q_content"
            R:
              asserts:
              - that: has_text
                text: "R_content"
        Y:
          class: Collection
          count: 3
          elements:
            P:
              asserts:
              - that: has_text
                text: "P_content"
            Q:
              asserts:
              - that: has_text
                text: "Q_content"
            R:
              asserts:
              - that: has_text
                text: "R_content"
