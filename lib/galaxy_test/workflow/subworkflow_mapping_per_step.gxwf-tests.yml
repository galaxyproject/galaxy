- doc: |
    Two elements are mapped over the subworkflow and three are connected to its
    collection input. The child remains one invocation, while its independent
    mapped step executes for every outer coordinate and produces a list:list.
  job:
    outer_mapping_source:
      class: Collection
      collection_type: list
      elements:
        - identifier: X
          class: File
          contents: "from_X"
        - identifier: Y
          class: File
          contents: "from_Y"
    inner_mapping_source:
      class: Collection
      collection_type: list
      elements:
        - identifier: P
          class: File
          contents: "P_content"
        - identifier: Q
          class: File
          contents: "Q_content"
        - identifier: R
          class: File
          contents: "R_content"
    second_inner_mapping_source:
      class: Collection
      collection_type: list
      elements:
        - identifier: U
          class: File
          contents: "U_content"
        - identifier: V
          class: File
          contents: "V_content"
        - identifier: W
          class: File
          contents: "W_content"
    pair_mapping_source:
      class: Collection
      collection_type: paired
      elements:
        - identifier: forward
          class: File
          contents: "comparison_forward"
        - identifier: reverse
          class: File
          contents: "comparison_reverse"
    direct_dataset:
      class: File
      contents: "direct_content"
  outputs:
    inherited_mapping_output:
      class: Collection
      collection_type: list
      element_count: 2
      elements:
        X:
          asserts:
          - that: has_text
            text: "from_X"
        Y:
          asserts:
          - that: has_text
            text: "from_Y"
    local_mapping_output:
      class: Collection
      collection_type: list:list
      element_count: 2
      elements:
        X:
          class: Collection
          count: 3
          elements:
            P:
              asserts:
              - that: has_text
                text: "P_content"
            Q:
              asserts:
              - that: has_text
                text: "Q_content"
            R:
              asserts:
              - that: has_text
                text: "R_content"
        Y:
          class: Collection
          count: 3
          elements:
            P:
              asserts:
              - that: has_text
                text: "P_content"
            Q:
              asserts:
              - that: has_text
                text: "Q_content"
            R:
              asserts:
              - that: has_text
                text: "R_content"
    mapped_input_passthrough:
      class: Collection
      collection_type: list
      element_count: 2
      elements:
        X:
          asserts:
          - that: has_text
            text: "from_X"
        Y:
          asserts:
          - that: has_text
            text: "from_Y"
    direct_collection_passthrough:
      class: Collection
      collection_type: list:list
      element_count: 2
      elements:
        X:
          class: Collection
          count: 3
          elements:
            P:
              asserts:
              - that: has_text
                text: "P_content"
            Q:
              asserts:
              - that: has_text
                text: "Q_content"
            R:
              asserts:
              - that: has_text
                text: "R_content"
        Y:
          class: Collection
          count: 3
          elements:
            P:
              asserts:
              - that: has_text
                text: "P_content"
            Q:
              asserts:
              - that: has_text
                text: "Q_content"
            R:
              asserts:
              - that: has_text
                text: "R_content"
    direct_dataset_passthrough:
      class: Collection
      collection_type: list
      element_count: 2
      elements:
        X:
          asserts:
          - that: has_text
            text: "direct_content"
        Y:
          asserts:
          - that: has_text
            text: "direct_content"
- doc: |
    An empty callable-boundary axis schedules no child jobs and still retains
    the declared nested output types.
  job:
    outer_mapping_source:
      class: Collection
      collection_type: list
      elements: []
    inner_mapping_source:
      class: Collection
      collection_type: list
      elements:
        - identifier: P
          class: File
          contents: "P_content"
    second_inner_mapping_source:
      class: Collection
      collection_type: list
      elements:
        - identifier: U
          class: File
          contents: "U_content"
    pair_mapping_source:
      class: Collection
      collection_type: paired
      elements:
        - identifier: forward
          class: File
          contents: "comparison_forward"
        - identifier: reverse
          class: File
          contents: "comparison_reverse"
    direct_dataset:
      class: File
      contents: "direct_content"
  outputs:
    inherited_mapping_output:
      class: Collection
      collection_type: list
      element_count: 0
    local_mapping_output:
      class: Collection
      collection_type: list:list
      element_count: 0
    collection_output_scalar_consumer:
      class: Collection
      collection_type: list:paired
      element_count: 0
    mapped_input_passthrough:
      class: Collection
      collection_type: list
      element_count: 0
    direct_collection_passthrough:
      class: Collection
      collection_type: list:list
      element_count: 0
    direct_dataset_passthrough:
      class: Collection
      collection_type: list
      element_count: 0
