[settings]
combine_as_imports=true
force_alphabetical_sort_within_sections=true
# Override force_grid_wrap value from profile=black, but black is still happy
force_grid_wrap=2
# Same line length as for black
line_length=120
no_lines_before=LOCALFOLDER
profile=black
reverse_relative=true
skip_gitignore=true
# Make isort run faster by skipping database
skip_glob=database/*,packages/tool_shed/src/tool_shed/test/test_data/repos/*
src_paths=lib,packages/util/src,packages/config/src,packages/data/src,packages/files/src,packages/job_execution/src,packages/job_metrics/src,packages/navigation/src,packages/objectstore/src,packages/schema/src,packages/selenium/src,packages/tool_shed_schema/src,packages/tool_util/src,packages/tool_util_models/src,packages/tours/src,packages/auth/src,packages/web_framework/src,packages/web_stack/src,packages/app/src,packages/web_apps/src,packages/tool_shed/src,packages/test_base/src,packages/test_api/src,packages/test_driver/src,packages/test_selenium/src

known_first_party=galaxy,galaxy_ext,galaxy_test,tool_shed,tool_shed_client
