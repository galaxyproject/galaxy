---
# Single source of truth for user-defined tool authoring guidance.
#
# Two consumers render this file:
#   - AuthoringHelpPanel.vue, the help panel in the tool editor
#   - doc/gen_authoring_doc.py, which generates
#     doc/source/dev/user_defined_tools_authoring.md at `make docs` time
#
# Bodies must be plain CommonMark so both renderers agree: no MyST roles or
# directives, and no relative links. Link to another Galaxy documentation page
# with a `gxdoc:` target naming the source file, e.g.
# `[tool schema](gxdoc:dev/schema.md)`. The generator rewrites it to a
# relative path; the editor rewrites it to an absolute docs.galaxyproject.org
# URL. Link to a page in the current Galaxy UI with `gxui:/path`; the editor
# keeps the instance-relative link and the Sphinx renderer names the page
# without emitting a broken link. Link a Galaxy help term with
# `[descriptive label](gxhelp://term.path)`; the editor adds the term's popover
# and the Sphinx renderer keeps the descriptive label without a broken link.
#
# Schema markers and sections with `parameter_types`, `output_types`, or
# `validator_types` are rendered from ToolSourceSchema.json. Its examples come
# from the Pydantic models.
#
# Per-field facts (units, required shapes) belong on the pydantic models
# instead: those reach the OpenAPI schema, the generated TypeScript client and
# the editor's hover help from one place. Keep this file for the prose that is
# too long to sit on a field.

title: Authoring User-Defined Tools

intro: |
  Create a Galaxy tool from a containerized command without waiting for an
  administrator to install it. Define its inputs and outputs here, then run it
  like any other tool.

sections:
  - id: quick-start
    title: Quick start
    kind: getting-started
    body: |
      Paste this definition into the editor. It accepts a text dataset and
      writes a copy without lines beginning with `#`.

      ```yaml
      {{quick_start_example}}
      ```

  - id: when-to-use
    title: When to write a user-defined tool
    kind: getting-started
    body: |
      A user-defined tool is the right choice when nothing installed does the
      job and the job is too small to be worth asking an administrator to
      install something. A one-off reformatting step, a filter nobody has
      wrapped, or a couple of commands glued together are all good candidates.

      When a tool that already does the job is installed on your Galaxy, prefer
      it. An installed tool is versioned, shared and citable, so a history or
      workflow built on it is easier for someone else to rerun and publish. A
      user-defined tool travels only with the workflow that embeds it, and only
      to users allowed to run user-defined tools.

  - id: managing-tools
    title: Finding the tools you have written
    kind: getting-started
    body: |
      Saved tools live under **Custom Tools**, the wrench in the activity bar.
      The panel lists each tool you have written with its name, version,
      description and when you last edited it. From there you can open the
      editor on a new tool, reopen a saved one to revise it, or disable a tool
      you want to keep but not see in the tool panel.

      A saved tool is yours alone. Other users cannot see or search for it,
      and it reaches them only through a workflow that embeds it, as described
      under [Using a tool in a workflow](#workflows).

  - id: examples
    title: Worked examples
    kind: getting-started
    body: |
      The quick start is about as small as a tool gets. These two are closer to
      the size of a real analysis step: several inputs, several outputs, and
      the work carried in a script rather than on the command line.

      The first reads a GFF/GTF annotation and a two-column mapping table,
      rewrites the sequence names in column 1, leaves names on an ignore list
      alone, and fails the job on a name it was not told about. It also writes
      a small report of what it did. The logic is longer than a shell one-liner
      is good for, so it goes in a `configfiles` script and `shell_command`
      just calls it with the input paths.

      ```yaml
      class: GalaxyUserTool
      id: gxf-seqname-normalizer
      name: Normalize GXF sequence names
      version: 0.2.0
      description: rename sequences in a GFF/GTF file from a mapping table
      container: python:3.11-slim
      shell_command: python normalize.py '$(inputs.annotation.path)' '$(inputs.mapping.path)'
        '$(inputs.ignore.path)' normalized.gxf report.tsv
      configfiles:
        - filename: normalize.py
          content: |
            import sys
            from collections import Counter

            ann_path, map_path, ign_path, out_path, rep_path = sys.argv[1:6]

            mapping = {}
            with open(map_path, encoding="utf-8") as fh:
                for line in fh:
                    if line.startswith("#") or not line.strip():
                        continue
                    parts = line.rstrip("\n").split("\t")
                    if len(parts) >= 2:
                        mapping[parts[0]] = parts[1]

            ignore = set()
            with open(ign_path, encoding="utf-8") as fh:
                for line in fh:
                    if line.startswith("#") or not line.strip():
                        continue
                    ignore.add(line.strip().split("\t")[0])

            counts = Counter()
            unknown = set()

            with open(ann_path, encoding="utf-8", errors="replace") as inp, open(
                out_path, "w", encoding="utf-8"
            ) as out:
                for line in inp:
                    if line.startswith("#") or not line.strip():
                        out.write(line)
                        continue
                    parts = line.rstrip("\n").split("\t")
                    seq = parts[0]
                    if seq in mapping:
                        parts[0] = mapping[seq]
                        counts["renamed"] += 1
                        out.write("\t".join(parts) + "\n")
                    elif seq in ignore:
                        counts["ignored"] += 1
                        out.write(line)
                    else:
                        counts["unknown"] += 1
                        unknown.add(seq)

            with open(rep_path, "w", encoding="utf-8") as rep:
                rep.write("metric\tvalue\n")
                for metric in ("renamed", "ignored", "unknown"):
                    rep.write(f"{metric}\t{counts[metric]}\n")

            if unknown:
                sys.exit("Unknown sequence names: " + ", ".join(sorted(unknown)))
      inputs:
        - name: annotation
          label: Annotation to rewrite
          type: data
          format:
            - gff
            - gff3
            - gtf
        - name: mapping
          label: Two-column old-name/new-name mapping
          type: data
          format:
            - tabular
        - name: ignore
          label: Sequence names to leave untouched
          type: data
          format:
            - tabular
      outputs:
        - name: normalized
          label: $(inputs.annotation.element_identifier) (renamed)
          type: data
          format_source: annotation
          from_work_dir: normalized.gxf
        - name: report
          label: $(inputs.annotation.element_identifier) (rename report)
          type: data
          format: tabular
          from_work_dir: report.tsv
      ```

      The second wraps [NucleoATAC](https://github.com/GreenleafLab/NucleoATAC)
      from a BioContainer image. It shows a multi-step script, a CPU request
      passed through to the program as `$GALAXY_SLOTS`, inputs restricted to
      particular datatypes, several labeled outputs, and a `help` block
      describing the tool to whoever runs it. NucleoATAC leaves out a result
      file when it has nothing to report, so the script creates an empty one in
      that case and every declared output is always claimed.

      ```yaml
      class: GalaxyUserTool
      id: nucleoatac-run
      name: NucleoATAC
      version: 0.5.0
      description: call nucleosome positions and occupancy from ATAC-seq data
      container: quay.io/biocontainers/nucleoatac:0.3.4--py27hf85d69d_6
      requirements:
        - type: resource
          cores_min: 4
      shell_command: sh run.sh '$(inputs.bam.path)' '$(inputs.reference.path)' '$(inputs.regions.path)'
      configfiles:
        - filename: run.sh
          content: |
            set -eu
            bam="$1"
            reference="$2"
            regions="$3"

            cp "$bam" reads.bam
            cp "$reference" ref.fa
            cp "$regions" regions.bed
            python -c "import pysam; pysam.index('reads.bam'); pysam.faidx('ref.fa')"

            nucleoatac run --bed regions.bed --bam reads.bam --fasta ref.fa --out result --cores "$GALAXY_SLOTS"

            # NucleoATAC omits a result file when it has nothing to report. Unpack
            # whatever is there and leave an empty file for the rest, so that a
            # no-call is distinguishable from a failed job.
            for name in occ occpeaks nucpos nucleoatac_signal nucmap_combined nfrpos; do
                : > "$name.out"
                for packed in "result.$name.bed.gz" "result.$name.bedgraph.gz"; do
                    if [ -s "$packed" ]; then
                        gunzip -c "$packed" > "$name.out"
                    fi
                done
            done
      inputs:
        - name: bam
          label: Coordinate-sorted ATAC BAM
          type: data
          format:
            - bam
        - name: reference
          label: Reference FASTA with matching sequence names
          type: data
          format:
            - fasta
        - name: regions
          label: Regions to analyze
          type: data
          format:
            - bed
      outputs:
        - name: occ
          label: $(inputs.bam.element_identifier) occupancy
          type: data
          format: bedgraph
          from_work_dir: occ.out
        - name: occpeaks
          label: $(inputs.bam.element_identifier) occupancy peaks
          type: data
          format: bed
          from_work_dir: occpeaks.out
        - name: nucpos
          label: $(inputs.bam.element_identifier) nucleosome positions
          type: data
          format: bed
          from_work_dir: nucpos.out
        - name: nucleoatac_signal
          label: $(inputs.bam.element_identifier) nucleosome signal
          type: data
          format: bedgraph
          from_work_dir: nucleoatac_signal.out
        - name: nucmap_combined
          label: $(inputs.bam.element_identifier) combined nucleosome map
          type: data
          format: bed
          from_work_dir: nucmap_combined.out
        - name: nfrpos
          label: $(inputs.bam.element_identifier) NFR positions
          type: data
          format: bed
          from_work_dir: nfrpos.out
      help:
        format: markdown
        content: |
          Runs NucleoATAC on a coordinate-sorted ATAC BAM, a reference FASTA and a
          regions BED, and reports nucleosome occupancy, occupancy peaks,
          nucleosome positions, nucleosome signal, a combined nucleosome map and
          nucleosome-free-region positions.

          The BAM, FASTA and BED must use the same sequence names. An output with
          nothing to report comes back as an empty dataset rather than failing the
          job.
      ```

  - id: tool-format
    title: Tool definition
    kind: reference
    body: |
      A user-defined tool is a YAML document. `class: GalaxyUserTool` selects
      the user-defined tool format. `container` selects a [container image](gxhelp://galaxy.tools.container)
      containing the program and everything it needs to run. `shell_command`
      supplies the [command line](gxhelp://unix.commandLine) Galaxy runs inside
      that image, with inputs referenced as `$(inputs.input_name)` for scalar
      values and `$(inputs.input_name.path)` for files.

      | Field | Details | Required |
      | --- | --- | --- |
      | `class` | Selects the user-defined tool format. Must be `GalaxyUserTool`. | Yes |
      | `id` | Stable lowercase identifier. Must start with a letter and may contain letters, digits, `_`, and `-`. | No |
      | `name` | Name displayed in the tool menu. | Yes |
      | `version` | Version of this wrapper. Change it when behavior or the container changes. | Yes |
      | `description` | Short text displayed after the tool name. | No |
      | `container` | Fully qualified image supplying the program, interpreters, libraries, and utilities the tool needs. | Yes |
      | `shell_command` | Command line Galaxy evaluates and runs in the selected image, with inputs referenced through expressions. | Yes |
      | [`configfiles`](#configfiles) | Scripts and configuration files required by the software you are wrapping. | No |
      | [`inputs`](#parameters) | Input parameters shown on the tool form. | No |
      | [`outputs`](#outputs) | Datasets and collections Galaxy claims after the command finishes. | No |
      | [`requirements`](#resource-requirements) | JavaScript helpers and compute-resource requests. | No |
      | [`help`](#help-content) | Longer help text shown below the tool form. | No |
      | [`tests`](#testing) | Tool test declarations. | No |
      | [`citations`](#citations-metadata), `license`, [`edam_operations`](#citations-metadata), [`edam_topics`](#citations-metadata), [`xrefs`](#citations-metadata) | Publication and ontology metadata. | No |
      | `profile` | Galaxy tool profile controlling versioned tool behavior. | No |

      Compared with an equivalent [Galaxy XML tool](gxdoc:dev/schema.md), three
      things differ:

      - `class: GalaxyUserTool` is required.
      - A top-level `container` is required. XML tools may instead resolve
        dependencies through Conda.
      - The command lives under `shell_command` and is templated with sandboxed
        JavaScript expressions rather than Cheetah, so it has no access to the
        Galaxy database or filesystem.

      Every output must say where its bytes come from: a `data` output needs
      `from_work_dir` or `discover_datasets`, and a collection output needs
      `discover_datasets`. An output that declares neither is rejected, because
      nothing would ever be claimed from the working directory.

  - id: configfiles
    title: Config files
    kind: reference
    body: |
      Use `configfiles` for scripts and configuration files required by the
      software you are wrapping. Galaxy writes each file into the job working
      directory before it runs `shell_command`. File content supports the same
      sandboxed ECMAScript expressions as the command.

      | Field | Details | Default | Required |
      | --- | --- | --- | --- |
      | `filename` | Name of the file in the job working directory. | — | No |
      | `content` | File contents, including any input expressions. | — | Yes |
      | `name` | Internal name for the config file. | — | No |
      | `eval_engine` | Template engine; user-defined tools use `ecmascript`. | `ecmascript` | No |

      ```yaml
      configfiles:
        - filename: message.txt
          content: |
            Selected motif: $(inputs.motif)
      shell_command: cat message.txt
      ```

  - id: parameters
    title: Input parameters
    kind: reference
    body: |
      User-defined tools support the input types listed below. Unknown and
      unsupported fields are rejected.

      {{parameter_type_index}}

      Each type below has its own field table and example.

      For `data` inputs, `format` lists accepted Galaxy datatype extensions.
      See the [Datatypes page](gxui:/datatypes) in your Galaxy instance for the
      extensions available there.

      Types that exist in the XML tool vocabulary but are rejected here:
      `hidden`, `drill_down`, `data_column`, `genomebuild`, `group_tag`,
      `baseurl`, `rules`, `directory`. XML-only fields such as `truevalue`,
      `falsevalue`, `argument`, `is_dynamic` and `parameter_type` are likewise
      rejected on any parameter.

  - id: validators
    title: Validators
    kind: reference
    parentId: parameters
    body: |
      Validators reject parameter values before a job starts. Each parameter
      type's field table lists the validators it supports.

      {{validator_type_index}}

  - id: outputs
    title: Outputs
    kind: reference
    body: |
      Each output declares a `type` and a `name`. Dataset outputs identify the
      produced file with `from_work_dir`; collection outputs use
      `discover_datasets`. An optional `label` sets the name shown in the
      history; see [Output labels](#output-labels).

      {{output_type_index}}

      Each type below has a field table and example.

  - id: parameter-types-reference
    title: Input parameter types
    kind: detailed-reference
    parameter_types: true
    body: |
      Field tables and examples for every input type supported by user-defined
      tools.

  - id: validator-types-reference
    title: Validator types
    kind: detailed-reference
    validator_types: true
    body: |
      Field tables and examples for every validator supported by user-defined
      tool inputs.

  - id: output-types-reference
    title: Output types
    kind: detailed-reference
    output_types: true
    body: |
      Field tables and examples for dataset and dataset collection outputs.

  - id: discover-datasets
    title: Discover datasets
    kind: detailed-reference
    body: |
      Use `discover_datasets` when a command creates a variable set of files.
      User-defined tools discover them by matching filenames produced in the
      job working directory.

      Pattern discovery matches a regular expression against filenames. Named
      groups such as `name`, `designation`, `ext`, and `dbkey` set the
      corresponding dataset metadata. Use `directory` to search below the job
      working directory, and set `recurse: true` to include nested directories.
      With recursion, `match_relative_path: true` applies the pattern to each
      path relative to `directory` instead of only the filename.

      The `format` field sets the Galaxy datatype extension when the pattern
      does not provide `ext`. See the [Datatypes page](gxui:/datatypes) in your
      Galaxy instance for the extensions it supports. Set `visible: true` to
      show discovered datasets individually in the history. For a `data`
      output, `assign_primary_output: true` assigns the first match to the
      declared primary output.

      Results default to lexical filename order. Choose `sort_key` from
      `filename`, `name`, `designation`, or `dbkey`; choose `sort_comp` as
      `lexical` or `numeric`; and set `sort_reverse: true` for descending order.

      ```yaml
      inputs: []
      shell_command: |
        mkdir reports
        printf 'sample\tvalue\nA\t1\n' > reports/A.tsv
        printf 'sample\tvalue\nB\t2\n' > reports/B.tsv
      outputs:
        - name: reports
          type: collection
          collection_type: list
          discover_datasets:
            - pattern: "(?P<name>.+)\\.tsv"
              directory: reports
              format: tabular
              visible: true
              sort_key: name
      ```

  - id: help-content
    title: Tool help
    kind: reference
    body: |
      Tool help is rendered below the input form. Declare its format and
      content together.

      | Field | Details | Required |
      | --- | --- | --- |
      | `format` | Must be `markdown`. | Yes |
      | `content` | Help shown to the user. | Yes |

      ```yaml
      help:
        format: markdown
        content: |
          Finds lines containing the selected motif.
      ```

  - id: citations-metadata
    title: Citations and metadata
    kind: reference
    body: |
      Use `citations` for publications describing the wrapped tool, `license`
      for the wrapper license, EDAM identifiers for topics and operations, and
      `xrefs` for identifiers in other registries.

      ```yaml
      citations:
        - type: doi
          content: 10.1093/bioinformatics/bts611
      license: MIT
      edam_topics:
        - topic_0102
      edam_operations:
        - operation_0308
      xrefs:
        - type: bio.tools
          value: example_tool
      ```

  - id: expressions
    title: Expression syntax
    kind: reference
    body: |
      `shell_command` is not handed to the shell unchanged. Galaxy first
      evaluates it with a sandboxed ECMAScript 5.1 engine, using the same
      parameter-reference syntax CWL uses, and only the evaluated result is
      written into the job script.

      | Form | Details | Example |
      | --- | --- | --- |
      | `$( ... )` | Parameter reference or single expression. | `$(inputs.num_lines)`, `$(inputs.query.path)` |
      | `${ ... }` | Function body that must return a value. | `${ return inputs.num_lines * 2 }` |

      Substituted values are inserted literally; Galaxy does **not** shell-quote
      them. Quote any substitution that can contain spaces yourself, as
      `'$(inputs.query.path)'`.

      Reusable helper functions can be declared with a `javascript` requirement,
      and are then available to every expression in the tool:

      ```yaml
      requirements:
        - type: javascript
          expression_lib:
            - |
              function basename(path) { return path.split('/').pop(); }
      ```

  - id: output-labels
    title: Output labels
    kind: reference
    body: |
      An output's `label` is the name its dataset or collection gets in the
      history. Galaxy fills in these references when it creates the job:

      | Reference | Value |
      | --- | --- |
      | `$(inputs.num_lines)`, `$(inputs.options.mode)` | A text, number, boolean or select input, also inside a conditional or section. |
      | `$(inputs.reads.name)` | A dataset or collection input's name in the history. |
      | `$(inputs.reads.element_identifier)` | For a run mapped over a collection, the identifier of the element the job runs on, such as a sample name. Otherwise the same as `name`. |
      | `$(inputs.reads.format)` | A dataset input's datatype. |
      | `$(runtime.on_string)` | The input description other tools use, such as `data 1 and data 2`. |

      An optional input left empty fills in as nothing. Anything else, such
      as `${ ... }` or a file path, is kept as written: an input may not have
      been written yet when the job is created. A label can be at most 250
      characters long.

      ```yaml
      outputs:
        - name: head
          type: data
          format: fastqsanger
          from_work_dir: head.fastq
          label: $(inputs.reads.element_identifier) (first $(inputs.num_lines) lines)
      ```

      Prefer `element_identifier` to `name`: sample names carry through a
      workflow, while a dataset's history name usually describes the step
      that made it, such as `Trim on data 1`.

  - id: expressions-shell
    title: Why do some shell constructs fail?
    kind: faq
    body: |
      The expression evaluator interprets `$(` and `${` as expression
      delimiters, so shell constructs using them are not passed to the shell:

      | Written in `shell_command` | Result |
      | --- | --- |
      | `$(date +%s)` | Evaluated as JavaScript; the job fails with an expression evaluation error. |
      | `${HOME}`, `${f%.txt}`, `${VAR:-default}` | Evaluated as JavaScript; normally a syntax error. |
      | `$(( 1 + 2 ))` | Evaluated as JavaScript and replaced by `3`, changing the command's meaning without an error. |
      | `$GALAXY_SLOTS`, `$HOME`, `$1` | Passed through untouched. A `$` not followed by `(` or `{` is ignored. |

      An unbraced shell variable is therefore the safe form, and `$GALAXY_SLOTS`
      in particular works as it does in XML tools.

      To emit a literal `$(` or `${`, escape the dollar with a backslash:
      `\$(date +%s)` reaches the shell as `$(date +%s)`.

      Backslash handling has one more consequence worth knowing. Escape
      processing only runs when the command contains `$(` or `${` somewhere; a
      command with no expression at all is passed through byte for byte. In a
      command that *does* contain an expression, `\\` collapses to a single `\`
      everywhere in that command, so a literal backslash pair has to be written
      as `\\\\`. Lone backslashes such as `\;`, `\.` and `\t` are left alone.

  - id: expressions-pattern
    title: How should I structure a command?
    kind: faq
    body: |
      Keep `shell_command` to a short invocation. When a command needs a script,
      put it in `configfiles`; each file's `content` is evaluated with the same
      expression syntax as `shell_command`. Within a shell script, evaluate each
      input once into a variable and use plain, unbraced shell variables below.

      CPU allocation is not a tool input: declare it with a
      [resource requirement](#resource-requirements) and pass the allocated
      `$GALAXY_SLOTS` value to the program.

      ```yaml
      requirements:
        - type: resource
          cores_min: 4
      configfiles:
        - filename: run.sh
          content: |
            set -eu
            query='$(inputs.query.path)'
            db='$(inputs.database.path)'

            foldseek easy-search "$query" "$db" result.m8 tmp --threads "$GALAXY_SLOTS"
      shell_command: sh run.sh
      ```

      User-defined tool commands run under `set -e`, so the first failing
      command ends the job.

  - id: containers
    title: Why is a command missing from the container?
    kind: faq
    body: |
      `container` is required, and the image it names is the only environment
      the command gets. Every binary, interpreter and library referenced by
      `shell_command`, including utilities used to sort, reformat or rename
      outputs, has to already exist in that image.

      A single-tool BioContainer is built to be small. Many do ship a Python
      interpreter, since they are conda environments, but a given image may not,
      and may equally lack utilities like `jq` or `bc`. Check before relying on
      one:

      ```console
      $ docker run --rm quay.io/biocontainers/foldseek:10.941cd33 sh -c 'command -v python3 awk sort'
      ```

      If a command needs several packages, use a multi-package (mulled) image or
      an image you build and publish yourself, rather than assuming a
      single-tool image also carries the others.

  - id: containers-reference
    title: How should I write the container image reference?
    kind: faq
    body: |
      Use a fully qualified `registry/repository:tag` reference:

      ```yaml
      container: quay.io/biocontainers/foldseek:10.941cd33
      ```

      A bare `foldseek:10.941cd33` is not resolved by Galaxy against
      BioContainers. The identifier is passed to the container runtime as
      written, and the runtime applies its own default registry, which for
      Docker is `docker.io/library`, where the image almost certainly does not
      exist. The failure surfaces at job runtime as an image pull error, not at
      tool creation.

      Do **not** prefix the value with `docker://`. Galaxy stores a `container`
      string as a Docker container description and adds the `docker://` prefix
      itself when the destination executes through Singularity or Apptainer;
      writing the prefix yourself produces a doubled `docker://docker://...`
      identifier.

      Author user-defined tools with the top-level `container` field. Which
      container runtime executes that image, and whether images are converted
      and cached ahead of time, depends on the server.

  - id: resource-requirements
    title: Resource requirements
    kind: reference
    body: |
      Declare compute needs with a `resource` entry under `requirements`:

      ```yaml
      requirements:
        - type: resource
          cores_min: 32
          ram_min: 8192
          cuda_device_count_min: 1
          cuda_device_count_max: 1
          gpu_memory_min: 40960
      ```

      | Field | Details | Required |
      | --- | --- | --- |
      | `type` | Selects a resource requirement. Must be `resource`. | Yes |
      | `cores_min`, `cores_max` | Minimum and maximum reserved CPU cores. Fractional values are allowed. | No |
      | `ram_min`, `ram_max` | Minimum and maximum reserved RAM in MiB. | No |
      | `tmpdir_min`, `tmpdir_max` | Minimum and maximum temporary-directory space in MiB. | No |
      | `cuda_version_min` | Minimum required CUDA runtime version. | No |
      | `cuda_compute_capability` | Minimum required CUDA compute capability. | No |
      | `gpu_memory_min` | Minimum required GPU memory in MiB. | No |
      | `cuda_device_count_min`, `cuda_device_count_max` | Minimum and maximum number of GPUs to reserve. | No |
      | `shm_size` | Requested `/dev/shm` size in bytes. | No |
      | `timelimit` | Maximum runtime in seconds. Galaxy terminates the job if it is exceeded. | No |

      Pass `$GALAXY_SLOTS` to threaded programs; Galaxy sets it to the number
      of CPU cores allocated to the job.

      Use numbers or numeric strings. Other strings are reserved for runtime
      expressions, which are not supported yet: a non-numeric value such as
      `2g` fails the create-time lint check (`ResourceRequirementExpression`),
      so the tool cannot be saved until it is corrected.

  - id: validation
    title: What does Galaxy check for me?
    kind: faq
    body: |
      Galaxy checks a user-defined tool at several points before it ever runs:

      - **Schema validation.** Unknown keys are rejected anywhere in the
        document, including inside inputs, outputs, requirements, config files
        and citations, so a misspelled or XML-only field fails immediately
        rather than being ignored.
      - **Cross-field validation.** Every `$(inputs.input_name)` referenced from
        `shell_command` or a config file must correspond to a declared input,
        and every output must declare where its bytes come from.
      - **Linting.** Creating or editing a tool runs Galaxy's tool linters and
        refuses the tool if any of them reports a problem. This includes a check
        that the container reference has a recognizable shape. Linters that call
        external services are skipped so that authoring does not depend on
        third-party availability.

      Two endpoints check a draft without saving it:
      `POST /api/unprivileged_tools/build` renders the tool form, which is the
      quickest way to confirm the input interface is what you intended, and
      `POST /api/unprivileged_tools/runtime_model` returns an OpenAPI model of
      the tool's inputs.

      None of this checks that the tool produces *correct results*. A tool that
      validates, lints and runs to completion can still be wrong: a misquoted
      path, a flag that silently changes meaning between tool versions, or a
      container whose tool version differs from the one the command was written
      against.

  - id: sandbox-limits
    title: What can a tool not reach?
    kind: faq
    body: |
      An expression sees the tool's declared inputs and nothing else. Several
      things an XML tool can reach are therefore unavailable, and a tool that
      needs one of them is not a good fit for this format yet:

      | Not available | What this rules out |
      | --- | --- |
      | Galaxy's reference data | Aligning against a server-managed genome chosen from a list. Pass a reference in as a `data` input instead. |
      | Dataset metadata | Branching on a dataset's line count, column count, dbkey or other metadata Galaxy has already computed. |
      | Metadata files | Reading an index Galaxy stores beside a dataset, such as a BAM `.bai`. Rebuild what you need in the job, as the NucleoATAC example does with `pysam.index`. |
      | A tool's `extra_files` directory | Shipping a static data file, script or lookup table alongside the tool. Put a script in `configfiles`, or bake the data into the container. |
      | The Galaxy database and filesystem | Anything the Cheetah templating in an XML tool could query. This is the point of the sandbox, not an oversight. |

      These are current limits of the beta rather than permanent ones.

  - id: testing
    title: Can Galaxy run the declared tests?
    kind: faq
    body: |
      A user-defined tool may declare a `tests` block, using the same test
      syntax as other YAML-format Galaxy tools:

      ```yaml
      tests:
        - inputs:
            input1:
              class: File
              path: simple_line.txt
          outputs:
            output1: simple_line.txt
      ```

      Galaxy stores and returns these tests, but does not currently run them for
      a tool held in the database. There is no in-application "run this tool's
      tests" action, and a database-stored tool has no tool directory, so
      file-based test inputs such as the `simple_line.txt` above cannot be
      resolved. Declared tests become executable once the tool is exported to
      disk and loaded like a regular tool, at which point the usual tool-test
      tooling applies.

      Until in-platform testing exists, validate correctness by running the tool
      on inputs whose answer you already know, and comparing the outputs against
      a run of the same command outside Galaxy. This is worth doing once per
      registered version, since a version bump usually means a new container
      image as well.

  - id: api
    title: API endpoints
    kind: reference
    body: |
      This editor is a client of a small API, so tools can also be created and
      managed programmatically, which is useful when registering many tools or
      many versions of one tool. All of these endpoints require the
      `Custom Tool Execution` role and operate only on the calling user's own
      tools.

      | Endpoint | Purpose |
      | --- | --- |
      | `POST /api/unprivileged_tools` | Create a tool; returns its `uuid`. |
      | `GET /api/unprivileged_tools` | List the calling user's tools. |
      | `GET /api/unprivileged_tools/{uuid}` | Show one tool and its representation. |
      | `DELETE /api/unprivileged_tools/{uuid}` | Deactivate a tool. |
      | `POST /api/unprivileged_tools/build?history_id=...` | Render the tool form without saving the tool. |
      | `POST /api/unprivileged_tools/runtime_model` | Return an OpenAPI model of the tool's inputs. |

      The create payload wraps the YAML document, converted to JSON, in a
      `representation` key. Keeping it in a file avoids complex shell quoting
      for `shell_command`:

      ```json
      {
        "representation": {
          "class": "GalaxyUserTool",
          "id": "my-cool-tool",
          "name": "My Cool Tool",
          "version": "0.1.0",
          "container": "quay.io/biocontainers/python:3.13",
          "shell_command": "head -n '$(inputs.n_lines)' '$(inputs.data_input.path)' > out.txt",
          "inputs": [
            {"type": "integer", "name": "n_lines"},
            {"type": "data", "name": "data_input"}
          ],
          "outputs": [
            {"type": "data", "name": "out", "from_work_dir": "out.txt"}
          ]
        }
      }
      ```

      ```console
      $ curl -X POST "$GALAXY_URL/api/unprivileged_tools" \
          -H "x-api-key: $GALAXY_API_KEY" \
          -H 'Content-Type: application/json' \
          -d @tool.json
      ```

      Run the resulting tool by passing its `uuid` to the normal tool execution
      endpoint: `POST /api/tools` with `tool_uuid` instead of `tool_id`. To use
      it in a workflow, see "Using a tool in a workflow" below.

      Your server publishes the request and response details at
      `<galaxy_url>/api/docs` under the `dynamic_tools` tag.

  - id: workflows
    title: Using a tool in a workflow
    kind: reference
    body: |
      In a format2 workflow (`.gxwf.yml`), put the tool definition under the
      step's `run` key. The workflow is then self-contained: whoever imports it
      gets a private copy of the tool, as long as they have the
      `Custom Tool Execution` role.

      ```yaml
      class: GalaxyWorkflow
      inputs:
        text_file:
          type: data
      outputs:
        without_comments:
          outputSource: remove_comments/output_file
      steps:
        remove_comments:
          run:
            class: GalaxyUserTool
            id: remove_comments
            version: 0.1.0
            name: Remove Comment Lines
            container: quay.io/biocontainers/grep:3.4--hf43ccf4_4
            shell_command: grep -v '^#' '$(inputs.input_file.path)' > output.txt || test "$?" = 1
            inputs:
              - name: input_file
                type: data
                format: txt
            outputs:
              - name: output_file
                type: data
                format_source: input_file
                from_work_dir: output.txt
          in:
            input_file: text_file
      ```

      Galaxy's `.ga` export works the same way: it includes the tool definition
      as `tool_representation`.

      What the importer gets is an independent copy, not a reference to your
      tool. Editing yours afterwards leaves theirs untouched, so a fix reaches
      them only when you share the workflow again. This is also the only way to
      hand a user-defined tool to someone else: there is no direct
      user-to-user share. An administrator who wants a tool available to
      everyone can export it to disk and load it like a regular tool, as
      described under
      [User-Defined Tools](gxdoc:admin/user_defined_tools.md).
