[mypy]
enable_error_code = ignore-without-code
plugins = pydantic.mypy
show_error_codes = True
ignore_missing_imports = True
check_untyped_defs = True
exclude = (?x)(
        ^build/
        | .*test/functional/tools/cwl_tools/
        | .*tool_shed/test/test_data/repos/
    )
pretty = True
no_implicit_reexport = True
no_implicit_optional = True
disallow_subclassing_any = True
strict_equality = True
warn_redundant_casts = True
warn_unreachable = True
warn_unused_ignores = True
platform = linux
explicit_package_bases = True

# New code must be fully typed; modules that predate this are relaxed below.
# See doc/source/dev/type_checking.md
disallow_any_generics = True
disallow_untyped_decorators = True
disallow_untyped_defs = True
warn_return_any = True

# test code is exempt from the strict defaults (tests.* is how packages/test.sh sees test/unit/)
[mypy-evals.*,galaxy_test.*,integration.*,integration_selenium.*,tests.*,tool_shed.test.*,unit.*]
disallow_any_generics = False
disallow_untyped_decorators = False
disallow_untyped_defs = False
warn_return_any = False

