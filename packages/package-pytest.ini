[pytest]
# Prevent execution of alembic/env.py at test collection stage (alembic.context not set).
# Also ignore functional tests (galaxy_test/ and tool_shed/test/), the sample tools and the
# datatype converters - those .py files are tool scripts, not importable modules.
addopts = --doctest-modules --import-mode=importlib --ignore=src/galaxy/model/migrations/alembic/ --ignore=src/galaxy/datatypes/converters/ --ignore=src/galaxy/tools/bundled/ --ignore=src/galaxy/tool_util/unittest_utils/functional_tools/ --ignore=src/galaxy_test/ --ignore=src/tool_shed/test/ --ignore=src/tool_shed/webapp/model/migrations/alembic/ --doctest-continue-on-failure --verbosity=1
asyncio_mode = auto
log_level = DEBUG
consider_namespace_packages = true
# Installed members provide Python packages; the checkout root provides tool assets.
pythonpath = ../..
