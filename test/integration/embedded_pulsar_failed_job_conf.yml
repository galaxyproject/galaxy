runners:
  pulsar_embed:
    load: galaxy.jobs.runners.pulsar:PulsarEmbeddedJobRunner
    pulsar_app_config:
      tool_dependency_dir: none
      conda_auto_init: false
      conda_auto_install: false
      managers:
        _default_:
          type: queued_cli
          job_plugin: Slurm
          shell_plugin: LocalShell
          min_polling_interval: 0.5

execution:
  default: pulsar_embed
  environments:
    pulsar_embed:
      runner: pulsar_embed
