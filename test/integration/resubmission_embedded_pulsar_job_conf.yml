runners:
  pulsar_embed:
    load: galaxy.jobs.runners.pulsar:PulsarEmbeddedJobRunner
    pulsar_app_config:  # this doesn't start without disabling - filelock problem
      tool_dependency_dir: none
      conda_auto_init: false
      conda_auto_install: false

execution:
  default: pulsar_tool_error
  environments:
    pulsar_tool_error:
      runner: pulsar_embed
      env:
        - name: GX_TARGET_EXIT_CODE
          value: "4"
      resubmit:
        - condition: tool_detected_failure
          environment: pulsar_good
    pulsar_good:
      runner: pulsar_embed
      env:
        - name: GX_TARGET_EXIT_CODE
          value: "0"
