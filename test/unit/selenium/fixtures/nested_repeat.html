<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nested Repeat Test Page</title>
  </head>
  <body>
    <!-- Shaped like FormRepeat and FormCard: "outer" instances hold an "inner" repeat with one instance,
         "wrap" instances hold a field and a collapsed section holding "inner", "bare" instances hold only
         an empty "inner", and two same-named "dup" repeats sit in sibling sections. -->
    <span data-description="galaxy tool version">1.0</span>
    <div>
      <h2>Tool Parameters</h2>
      <div id="form"></div>
    </div>
    <script>
      const element = (id) => {
        const div = document.createElement("div");
        div.className = "ui-form-element";
        div.id = `form-element-${id}`;
        div.append(document.createElement("input"));
        return div;
      };
      const section = (children, collapsed) => {
        const div = document.createElement("div");
        div.className = "ui-portlet-section";
        div.innerHTML = `<div class="portlet-header">Section</div><div class="portlet-content"></div>`;
        const content = div.querySelector(".portlet-content");
        if (collapsed) content.style.display = "none";
        content.append(...children);
        div.querySelector(".portlet-header").addEventListener("click", () => {
          content.style.display =
            content.style.display === "none" ? "" : "none";
        });
        return div;
      };
      // Instance contents by repeat path; nested "inner" instances hold one field.
      const bodies = {
        same: (instance) => [repeat("inner", `${instance}|inner`, 1)],
        "same_0|inner": (instance) => [
          element(`${instance}|x`),
          repeat("inner", `${instance}|inner`),
        ],
        outer: (instance) => [repeat("inner", `${instance}|inner`, 1)],
        wrap: (instance) => [
          element(`${instance}|y`),
          section([repeat("inner", `${instance}|sec|inner`)], true),
        ],
        bare: (instance) => [repeat("inner", `${instance}|inner`)],
      };
      const insert = (container, path) => {
        const instance = `${path}_${container.querySelectorAll(":scope > [data-description='repeat block']").length}`;
        // A repeat block is a non-collapsible FormCard: its operations sit in the header.
        const block = document.createElement("div");
        block.className = "ui-portlet-section card";
        block.dataset.description = "repeat block";
        block.innerHTML = `<div class="portlet-header"><div class="portlet-operations"><button id="${instance}_up"></button><button id="${instance}_down"></button><button id="${instance}_clone"></button></div></div><div class="portlet-content"></div>`;
        const body = bodies[path]
          ? bodies[path](instance)
          : [element(`${instance}|x`)];
        block.querySelector(".portlet-content").append(...body);
        container.querySelector(":scope > button").before(block);
      };
      function repeat(name, path, min = 0) {
        const container = document.createElement("div");
        container.innerHTML = `<button><span data-description="repeat insert" data-repeat-name="${name}">Insert ${name}</span></button>`;
        container
          .querySelector(":scope > button")
          .addEventListener("click", () => insert(container, path));
        for (let n = 0; n < min; n++) insert(container, path);
        return container;
      }
      document
        .getElementById("form")
        .append(
          repeat("outer", "outer", 1),
          repeat("same", "same", 1),
          repeat("wrap", "wrap"),
          repeat("bare", "bare"),
          section([repeat("dup", "a|dup")], false),
          section([repeat("dup", "b|dup")], false),
        );
    </script>
  </body>
</html>
