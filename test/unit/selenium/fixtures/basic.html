<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Test Page</title>
    <style>
      .hidden {
        display: none;
      }
      .visible {
        display: block;
      }
      .delayed-visible {
        display: none;
      }
      #disabled-button {
        pointer-events: none;
        opacity: 0.5;
      }
      #hover-target {
        width: 200px;
        height: 100px;
        background-color: blue;
        transition: background-color 0.1s;
      }
      #hover-target:hover {
        background-color: red;
      }
      #hover-indicator {
        display: none;
      }
      #hover-target:hover + #hover-indicator {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1 id="header">Test Page</h1>

    <!-- Elements for testing finding methods -->
    <div id="test-div" class="test-class">Test Div</div>
    <p class="test-paragraph">Test Paragraph</p>
    <span data-testid="test-span">Test Span</span>

    <!-- Link for testing -->
    <a href="#" id="test-link">Test Link</a>

    <!-- Elements for visibility testing -->
    <div id="visible-element" class="visible">I am visible</div>
    <div id="hidden-element" class="hidden">I am hidden</div>
    <div id="delayed-element" class="delayed-visible">
      I will become visible
    </div>
    <div id="enter-element" class="hidden">I clicked enter.</div>

    <!-- Form elements -->
    <form id="test-form" action="/submit" method="post">
      <label for="username">Username:</label>
      <input
        type="text"
        id="username"
        name="username"
        onkeydown="if(event.key === 'Enter'){ document.getElementById('enter-element').classList.remove('hidden'); }"
      />

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" />

      <label for="email">Email:</label>
      <input type="email" name="email" id="email" />

      <label for="fruit-select">Favorite Fruit:</label>
      <select id="fruit-select" name="fruit">
        <option value="">--Choose a fruit--</option>
        <option value="apple">Apple</option>
        <option value="banana">Banana</option>
        <option value="cherry">Cherry</option>
        <option value="durian">Durian</option>
      </select>

      <button type="button" id="clickable-button">Click Me</button>
      <button type="button" id="disabled-button" disabled>
        Disabled Button
      </button>
      <input type="submit" value="Submit" />
    </form>

    <!-- Elements for xpath testing -->
    <div class="xpath-container">
      <ul>
        <li class="item">Item 1</li>
        <li class="item">Item 2</li>
        <li class="item">Item 3</li>
      </ul>
    </div>

    <!-- Alert button -->
    <button id="alert-button" onclick="alert('Test Alert')">Show Alert</button>

    <!-- Hover testing elements -->
    <div id="hover-target">Hover over me</div>
    <div id="hover-indicator">Hover detected!</div>

    <!-- Mousedown testing elements -->
    <div id="mousedown-target">Press me</div>
    <div id="mousedown-indicator" class="hidden">Mousedown detected!</div>

    <!-- Drag and drop testing elements -->
    <div id="drag-source" draggable="true">Drag me</div>
    <div id="drop-target">Drop here</div>

    <!-- Drop target that re-renders its contents when a drag enters, the way a
         v-if swap does. The inner box is what a caller grabs before dragging. -->
    <div id="rerender-drop-zone">
      <div id="rerender-inner">Drop here too</div>
    </div>

    <!-- Client-side route change, the way a Vue router push after a save is:
         the URL moves with no document navigation, and not until a later tick. -->
    <button id="push-state-later">Push state</button>

    <!-- Frame for iframe testing -->
    <iframe
      name="frame"
      id="test-frame"
      src="frame.html"
      style="width: 300px; height: 200px"
    ></iframe>

    <script>
      // Make element visible after delay
      setTimeout(() => {
        document
          .getElementById("delayed-element")
          .classList.remove("delayed-visible");
        document.getElementById("delayed-element").classList.add("visible");
      }, 1000);

      // Mousedown handler
      document
        .getElementById("mousedown-target")
        .addEventListener("mousedown", function () {
          document
            .getElementById("mousedown-indicator")
            .classList.remove("hidden");
        });

      // Button click handler
      document
        .getElementById("clickable-button")
        .addEventListener("click", function () {
          this.textContent = "Clicked!";
          this.classList.add("was-clicked");
        });

      // Form submission handler
      document
        .getElementById("test-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const result = document.createElement("div");
          result.id = "form-result";
          result.textContent = "Form submitted!";
          document.body.appendChild(result);
        });

      // Drag and drop handlers
      document
        .getElementById("drag-source")
        .addEventListener("dragstart", function (e) {
          e.dataTransfer.setData("text/plain", "dragged-payload");
        });

      const dropTarget = document.getElementById("drop-target");
      dropTarget.addEventListener("dragover", function (e) {
        e.preventDefault();
      });
      dropTarget.addEventListener("drop", function (e) {
        e.preventDefault();
        dropTarget.textContent =
          "Dropped: " + e.dataTransfer.getData("text/plain");
      });

      document
        .getElementById("push-state-later")
        .addEventListener("click", function () {
          setTimeout(function () {
            history.pushState({}, "", "basic.html?pushed=1");
          }, 100);
        });

      // The zone listens, but dragenter replaces the inner box the caller is
      // holding a reference to - so a non-atomic event sequence loses the drop.
      const rerenderZone = document.getElementById("rerender-drop-zone");
      rerenderZone.addEventListener("dragenter", function () {
        const inner = document.getElementById("rerender-inner");
        if (inner) {
          inner.remove();
          const replacement = document.createElement("div");
          replacement.id = "rerender-replacement";
          replacement.textContent = "Release to drop";
          rerenderZone.appendChild(replacement);
        }
      });
      rerenderZone.addEventListener("dragover", function (e) {
        e.preventDefault();
      });
      rerenderZone.addEventListener("drop", function (e) {
        e.preventDefault();
        rerenderZone.textContent =
          "Dropped: " + e.dataTransfer.getData("text/plain");
      });
    </script>
  </body>
</html>
