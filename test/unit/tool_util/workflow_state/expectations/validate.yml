# Declarative tests for the validate operation.
# validate raises on precheck skip (legacy encoding) or validation
# failures; on success returns the workflow dict.

validate_legacy_encoding_skipped:
  fixture: test_workflow_1.ga
  operation: validate
  expect_error: true

validate_stale_keys_rejected:
  fixture: synthetic-cat1-stale.ga
  operation: validate
  expect_error: true

validate_clean_cat1_passes:
  fixture: synthetic-cat1-clean.ga
  operation: validate
  assertions:
    - path: [steps, "1", tool_id]
      value: cat1
    - path: [steps, "1", tool_state]
      value_type: dict
    - path: [steps, "0", type]
      value: data_input

# --- Format2 input ---

validate_format2_cat1_passes:
  fixture: synthetic-cat1.gxwf.yml
  operation: validate
  assertions:
    - path: [steps, concat, tool_id]
      value: cat1

# --- Inline user-defined tool (UDT) workflows ---

validate_inline_udt_native_passes:
  fixture: cat_udt_native.ga
  operation: validate
  assertions:
    - path: [steps, "1", tool_representation, class]
      value: GalaxyUserTool
    - path: [steps, "1", tool_representation, id]
      value: cat_user_defined

validate_inline_udt_format2_passes:
  fixture: cat_udt_format2.gxwf.yml
  operation: validate
  assertions:
    - path: [steps, the_udt, run, class]
      value: GalaxyUserTool
    - path: [steps, the_udt, run, id]
      value: cat_user_defined

# --- IWC workflows (stale keys cause validation failures) ---

validate_iwc_repeatmasking_stale_rejected:
  fixture: RepeatMasking-Workflow.ga
  operation: validate
  expect_error: true

validate_iwc_rnaseq_subworkflow_stale_rejected:
  fixture: rnaseq-sr.ga
  operation: validate
  expect_error: true

# --- Connection keys matching no tool parameter ---
# The `cat` functional tool resolves without a tool cache, so these four cases
# exercise the real validators rather than skipping on unresolved tool info.
# Each negative is paired with a positive control on the same path, so a
# failure can't be credited to the wrong check.

validate_native_conditional_when_passes:
  fixture: synthetic-cat-conditional.ga
  operation: validate
  assertions:
    - path: [steps, "2", when]
      value: $(inputs.when)

validate_native_unmatched_connection_rejected:
  fixture: synthetic-cat-unmatched-connection.ga
  operation: validate
  expect_error: true

validate_format2_conditional_when_passes:
  fixture: synthetic-cat-conditional.gxwf.yml
  operation: validate
  assertions:
    - path: [steps, concat, tool_id]
      value: cat

validate_format2_unmatched_connection_rejected:
  fixture: synthetic-cat-unmatched-connection.gxwf.yml
  operation: validate
  expect_error: true
