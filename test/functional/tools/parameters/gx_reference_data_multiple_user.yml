class: GalaxyUserTool
id: gx_reference_data_multiple_user
version: "1.0.0"
name: gx_reference_data_multiple_user
container: busybox
shell_command: |
  echo '$(inputs.reference.map(function(r) { return r.source.value + ":" + r.metadata.dbkey; }).join(" "))' > output.txt
inputs:
  - name: reference
    type: reference_data
    table: test_fasta_indexes
    multiple: true
outputs:
  - name: output
    type: data
    format: txt
    from_work_dir: output.txt
tests:
  - inputs:
      reference:
        - hg19_value
        - mm10_value
    outputs:
      output:
        asserts:
          - has_line:
              line: hg19_value:hg19 mm10_value:mm10
