class: GalaxyUserTool
id: gx_numeric_zero_user
version: "1.0.0"
name: gx_numeric_zero_user
container: busybox
shell_command: echo '$(inputs.integer) $(inputs.float) $(inputs.optional_integer) $(inputs.optional_float)' >> output.txt
inputs:
  - name: integer
    type: integer
    value: 0
  - name: float
    type: float
    value: 0.0
  - name: optional_integer
    type: integer
    optional: true
    value: 0
  - name: optional_float
    type: float
    optional: true
    value: 0.0
outputs:
  - name: output
    type: data
    format: txt
    from_work_dir: output.txt
tests:
  - outputs:
      output:
        asserts:
          - has_line:
              line: '0 0 0 0'
