# ty complements mypy during the type-checker transition. Run it with `make ty` (or `tox -e ty`); CI does
# the same in the "Python linting" job. See doc/source/dev/type_checking.md.
#
# The comments below note where each setting corresponds to one of mypy's,
# which remains enabled in CI (see mypy.ini).

[environment]
# Galaxy's sources live in lib/ (not the conventional ./ or ./src/) and the
# project is not installed into the venv (uv `package = false`), so tools
# need to be told where first-party modules are. `test` is also a root so
# relative imports in the test suite (e.g. `from ..util import ...`) resolve.
root = ["lib", "test"]
# mypy had `platform = linux`.
python-platform = "linux"
# mypy had no `python_version`, so it used the running interpreter. Pinning the
# oldest supported version instead keeps the diagnostics the same on every CI
# matrix leg (ty would otherwise resolve this from `requires-python` anyway).
python-version = "3.10"

[src]
include = ["lib", "test"]
exclude = [
    # mypy.ini `exclude`
    "build",
    "**/unittest_utils/functional_tools",
    "**/test/functional/tools/cwl_tools",
    "**/tool_shed/test/test_data/repos",
]

[analysis]
# mypy `strict_equality = True`
strict-equality-semantics = true

[rules]
# mypy `disallow_any_generics = True`
missing-type-argument = "error"
# mypy `disallow_untyped_decorators = True`
dynamic-function-decorator-return = "error"
# mypy `warn_return_any = True`
unsound-return-statement = "error"
# mypy `disallow_subclassing_any = True`
unsupported-dynamic-base = "error"
# mypy `ignore_missing_imports = True`: unresolved imports are treated as
# `Any`. The list of modules Galaxy only imports when an optional dependency is
# installed is not spelled out here, so this also silences imports of modules
# that don't exist at all. Tighten with `analysis.allowed-unresolved-imports`
# instead of turning this rule back on.
unresolved-import = "ignore"

# Test code is exempt from the strict defaults above, as in mypy.ini
# (evals.*, galaxy_test.*, integration.*, integration_selenium.*, tests.*,
# tool_shed.test.*, unit.*, functional.* and manual.*). ty always checks the
# bodies of unannotated functions, so unlike mypy there is no
# `check_untyped_defs` to turn off here; the regular diagnostics reported in
# test code are listed in the exemption list below instead.
[[overrides]]
include = [
    "lib/galaxy_test/**",
    "lib/tool_shed/test/**",
    "packages/**/tests/**",
    "test/evals/**",
    "test/functional/**",
    "test/integration/**",
    "test/integration_selenium/**",
    "test/manual/**",
    "test/unit/**",
]

[overrides.rules]
dynamic-function-decorator-return = "ignore"
missing-type-argument = "ignore"
unsound-return-statement = "ignore"

# The exemption list (mypy.ini's "red list"): modules that still fail one or
# more rules. Each entry lists the files that fail a rule; delete an entry as
# soon as its files pass again, and never add entries for new modules --
# annotate the new code instead. Managed by .ci/check_ty_exemptions.py
# (tox -e ty_exemptions), which removes stale entries automatically.

