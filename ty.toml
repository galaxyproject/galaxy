# Workspace members are installed as editables by uv; ty discovers their
# public import roots through the project environment.
[src]
include = ["packages", "test"]
exclude = [
    "packages/*/build",
    "packages/*/dist",
    "packages/tool_shed/src/tool_shed/test/test_data/repos",
    "test/functional/tools/cwl_tools",
]
