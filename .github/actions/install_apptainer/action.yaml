name: Install Apptainer
description: Install Apptainer's singularity from the official PPA
runs:
  using: "composite"
  steps:
    - name: Add Apptainer official PPA
      # Not add-apt-repository: it fetches the key from the flaky Launchpad API.
      # Without `Architectures: amd64`, apt prefers Ubuntu's amd64v3 packages.
      run: |
        sudo install -D -m 644 "${{ github.action_path }}/apptainer-ppa.asc" /etc/apt/keyrings/apptainer-ppa.asc
        sudo tee /etc/apt/sources.list.d/apptainer-ppa.sources <<EOF
        Types: deb
        URIs: https://ppa.launchpadcontent.net/apptainer/ppa/ubuntu
        Suites: $(lsb_release -sc)
        Components: main
        Architectures: amd64
        Signed-By: /etc/apt/keyrings/apptainer-ppa.asc
        EOF
      shell: bash
    - name: Prefer the packages from the PPA
      # The origin of a PPA named "ppa" is "LP-PPA-<owner>", without the PPA name.
      run: |
        sudo tee /etc/apt/preferences.d/pin-apptainer-ppa <<EOF
        Package: *
        Pin: release o=LP-PPA-apptainer
        Pin-Priority: 1001
        EOF
      shell: bash
    - name: Install apptainer package
      run: |
        sudo apt-get -o Acquire::Retries=5 update
        # Diagnostic: Check what APT thinks before installing
        apt policy apptainer
        # Need to explicitly install squashfuse due to
        # https://bugs.launchpad.net/ubuntu/+source/apptainer/+bug/2152206
        sudo apt-get -o Acquire::Retries=5 -y install apptainer squashfuse
      shell: bash
