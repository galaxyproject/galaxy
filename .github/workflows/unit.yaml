name: Unit tests
on:
  push:
    paths:
      - '**'
      - '!client/**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/unit.yaml'
      - '.github/workflows/_report_scheduled_result.yaml'
  pull_request:
    paths:
      - '**'
      - '!client/**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/unit.yaml'
      - '.github/workflows/_report_scheduled_result.yaml'
  schedule:
    # Run every supported Python version at 00:17 UTC daily
    - cron: '17 0 * * *'
  workflow_dispatch:
env:
  UV_HTTP_RETRIES: '6'
concurrency:
  # Keep pushes to dev from cancelling the scheduled run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull requests and pushes to dev run only the newest Python; ruff and mypy catch most code too new for the oldest.
        # Release branches get no nightly run, so they keep the oldest and newest.
        python-version: >-
          ${{ fromJSON(
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.10", "3.11", "3.12", "3.13", "3.14"]'
          || startsWith(github.base_ref || github.ref_name, 'release_') && '["3.10", "3.14"]'
          || '["3.14"]'
          ) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: galaxy root/.tool-versions
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg and bubblewrap
        # bubblewrap: exercises the expression-evaluation isolation sandbox tests.
        # Ubuntu >=24.04 restricts unprivileged user namespaces (which bwrap needs);
        # allow them so the sandbox test can run.
        run: |
          sudo apt-get update && sudo apt-get -y install ffmpeg bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Prepare EngageQueue container test image
        run: docker pull alpine:latest
      - name: Run tests
        run: tox -e "$TOX_ENV"
        env:
          PYTEST_ADDOPTS: -n 4
          # Coverage slows the tests down; collect it for pushes only, so nightly runs don't skew dev coverage.
          TOX_ENV: ${{ github.event_name == 'push' && 'unit-coverage' || 'unit' }}
        working-directory: 'galaxy root'
      - uses: codecov/codecov-action@v7.1.1
        if: github.event_name == 'push'
        with:
          flags: py-unit
          working-directory: 'galaxy root'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Unit test results (${{ matrix.python-version }})
          path: 'galaxy root/run_unit_tests.html'
  engagequeue-macos:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    name: EngageQueue native (${{ matrix.runner }}, Python 3.12)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-26
            architecture: arm64
    defaults:
      run:
        working-directory: galaxy
    env:
      CONDA_PKGS_DIRS: ${{ github.workspace }}/galaxy/.cache/conda/pkgs
      PIP_CACHE_DIR: ${{ github.workspace }}/galaxy/.cache/pip
      UV_CACHE_DIR: ${{ github.workspace }}/galaxy/.cache/uv
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: galaxy
          persist-credentials: false
      - name: Install Miniforge
        run: |
          if [ ! -x "$HOME/miniforge3/bin/conda" ]; then
            curl -fsSL "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-MacOSX-$(uname -m).sh" -o "$RUNNER_TEMP/miniforge.sh"
            bash "$RUNNER_TEMP/miniforge.sh" -b -p "$HOME/miniforge3"
          fi
      - name: Create project-local environment
        run: '"$HOME/miniforge3/bin/conda" create -y -p "$PWD/.conda/galaxy" -c conda-forge python=3.12 pip'
      - name: Install Galaxy test dependencies
        # pytest-postgresql imports psycopg even for the SQLite cases. Bundle
        # libpq through the binary extra, constrained by the test requirements.
        run: |
          .conda/galaxy/bin/python -m pip install "uv==$(awk '$1 == "uv" { print $2 }' .tool-versions)"
          .conda/galaxy/bin/uv pip install --python .conda/galaxy/bin/python \
            --extra-index-url https://wheels.galaxyproject.org/simple \
            --index-strategy unsafe-best-match \
            -r requirements.txt -r lib/galaxy/dependencies/pinned-test-requirements.txt \
            'psycopg[binary]'
      - name: Verify native macOS SDK installation
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          .conda/galaxy/bin/python - <<'PY'
          import os
          import platform
          import sys
          from pathlib import Path

          import engagequeue

          assert sys.platform == "darwin", sys.platform
          assert sys.version_info[:2] == (3, 12), sys.version
          assert platform.machine() == os.environ["EXPECTED_ARCHITECTURE"], platform.machine()
          assert engagequeue.__version__ == "0.1.1", engagequeue.__version__
          assert Path(engagequeue.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          PY
      - name: Exercise native execution and Galaxy completion
        # No services or Docker image preload: real Docker cases skip when
        # their daemon or cached image is unavailable; native cases still run.
        run: |
          export PATH="$PWD/.conda/galaxy/bin:$PATH"
          export CONDA_PREFIX="$PWD/.conda/galaxy"
          export GALAXY_VIRTUAL_ENV="$PWD/.conda/galaxy"
          PYTHONPATH="$PWD/lib" .conda/galaxy/bin/python -m pytest -q \
            test/unit/app/dependencies/test_deps.py \
            test/unit/app/jobs/test_engagequeue*.py \
            test/unit/app/jobs/test_startup_stop_legacy_safety.py \
            test/unit/app/jobs/test_command_factory.py \
            test/unit/app/jobs/test_command_factory_work_dir_outputs.py \
            test/unit/app/jobs/test_set_metadata_failure.py \
            test/unit/app/jobs/test_upload_finish.py \
            test/unit/app/tools/test_evaluation.py \
            test/unit/app/tools/test_wrappers.py \
            test/unit/app/managers/test_interactivetool.py \
            --junitxml=reports/engagequeue-macos.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EngageQueue native results (${{ matrix.runner }})
          path: galaxy/reports/engagequeue-macos.xml
          if-no-files-found: ignore
  report:
    needs: [test, engagequeue-macos]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    permissions:
      actions: read
      issues: write
    uses: $/.github/workflows/_report_scheduled_result.yaml
    with:
      title: Scheduled unit tests are failing
      labels: area/testing, kind/bug
      description: |-
        The nightly Python unit tests or native macOS execution tests failed.

        Pull requests to dev run the unit tests on the newest Python only; nightly runs cover every supported version. Release branches retain the oldest and newest versions. Native EngageQueue integration also runs on Intel and Apple Silicon macOS with Python 3.12.
      needs: ${{ toJSON(needs) }}
