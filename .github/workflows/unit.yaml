name: Unit tests
on:
  push:
    paths:
      - '**'
      - '!client/**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/unit.yaml'
      - '.github/workflows/_report_scheduled_result.yaml'
  pull_request:
    paths:
      - '**'
      - '!client/**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/unit.yaml'
      - '.github/workflows/_report_scheduled_result.yaml'
  workflow_call:
    inputs:
      target-branch:
        description: Branch being tested by the nightly dispatcher.
        type: string
        default: ''
      target-sha:
        description: Resolved commit to test and include in failure reports.
        type: string
        default: ''
      python-version:
        description: The single Python version configured for this branch.
        type: string
        default: ''
concurrency:
  # Keep pushes to dev from cancelling the scheduled run.
  group: unit-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.target-branch || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    name: ${{ inputs.target-branch && format('Unit tests [{0}] ({1})', inputs.target-branch, matrix.python-version) || format('Test ({0})', matrix.python-version) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull requests and pushes to dev run only the newest Python; ruff and mypy catch most code too new for the oldest.
        # Release PRs keep both endpoints until their CI policy is backported.
        python-version: >-
          ${{ fromJSON(
          inputs.python-version && format('["{0}"]', inputs.python-version)
          || startsWith(github.base_ref || github.ref_name, 'release_') && '["3.10", "3.14"]'
          || '["3.14"]'
          ) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.target-branch && 'galaxyproject/galaxy' || github.repository }}
          ref: ${{ inputs.target-sha }}
          path: 'galaxy root'
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ hashFiles('galaxy root/.tool-versions') == '' && '0.12.23' || '' }}
          version-file: ${{ hashFiles('galaxy root/.tool-versions') != '' && 'galaxy root/.tool-versions' || '' }}
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg and bubblewrap
        # bubblewrap: exercises the expression-evaluation isolation sandbox tests.
        # Ubuntu >=24.04 restricts unprivileged user namespaces (which bwrap needs);
        # allow them so the sandbox test can run.
        run: |
          sudo apt-get update && sudo apt-get -y install ffmpeg bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Run tests
        run: tox -e "$TOX_ENV"
        env:
          PYTEST_ADDOPTS: -n 4
          # Coverage slows the tests down; collect it for pushes and scheduled runs only.
          TOX_ENV: ${{ github.event_name == 'pull_request' && 'unit' || 'unit-coverage' }}
        working-directory: 'galaxy root'
      - uses: codecov/codecov-action@v7.1.1
        if: github.event_name != 'pull_request'
        with:
          override_commit: ${{ inputs.target-sha }}
          override_branch: ${{ inputs.target-branch }}
          flags: py-unit
          working-directory: 'galaxy root'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Unit test results (${{ inputs.target-branch || github.ref_name }}, ${{ matrix.python-version }})
          path: 'galaxy root/run_unit_tests.html'
  report:
    needs: [test]
    if: ${{ !cancelled() && inputs.target-branch != '' }}
    permissions:
      actions: read
      issues: write
    uses: $/.github/workflows/_report_scheduled_result.yaml
    with:
      title: Scheduled unit tests are failing (${{ inputs.target-branch }})
      labels: area/testing, kind/bug
      description: Nightly unit tests on `${{ inputs.target-branch }}` using Python ${{ inputs.python-version }} failed.
      needs: ${{ toJSON(needs) }}
      tested-sha: ${{ inputs.target-sha }}
      job-name-prefix: Unit tests [${{ inputs.target-branch }}]
