name: Mypy strict ratchet
on:
  pull_request:
    paths:
      - '**.py'
      - '.ci/mypy_strict_count.sh'
      - '.github/workflows/mypy_strict_ratchet.yaml'
      - lib/galaxy/dependencies/**
      - mypy.ini
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  compare:
    name: Compare against target branch
    runs-on: ubuntu-latest
    env:
      PIP_EXTRA_INDEX_URL: https://wheels.galaxyproject.org/simple
      UV_EXTRA_INDEX_URL: https://wheels.galaxyproject.org/simple
      UV_INDEX_STRATEGY: unsafe-best-match
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.10'
      - name: Copy the counting script out of the checkout
        # so it still works once we `git checkout` the target branch below,
        # which may predate this script.
        run: cp .ci/mypy_strict_count.sh /tmp/mypy_strict_count.sh
      - name: Install mypy and its dependencies
        run: |
          uv venv
          uv pip install \
            -r lib/galaxy/dependencies/pinned-typecheck-requirements.txt \
            -r lib/galaxy/dependencies/pinned-requirements.txt \
            -r lib/galaxy/dependencies/pinned-test-requirements.txt
      - name: Count mypy strict errors on the PR head
        id: head
        run: |
          . .venv/bin/activate
          echo "count=$(sh /tmp/mypy_strict_count.sh)" >> "$GITHUB_OUTPUT"
      - name: Check out the target branch
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git checkout "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Count mypy strict errors on the target branch
        id: base
        run: |
          . .venv/bin/activate
          echo "count=$(sh /tmp/mypy_strict_count.sh)" >> "$GITHUB_OUTPUT"
      - name: Compare
        run: |
          echo "PR head errors: $HEAD_COUNT"
          echo "Target branch (${GITHUB_BASE_REF}) errors: $BASE_COUNT"
          if [ "$HEAD_COUNT" -gt "$BASE_COUNT" ]; then
            echo "::error::The number of mypy errors under a fully strict configuration (excluding test/ and lib/galaxy_test/) increased from $BASE_COUNT to $HEAD_COUNT. Please add type annotations to the new or changed code."
            exit 1
          fi
        env:
          HEAD_COUNT: ${{ steps.head.outputs.count }}
          BASE_COUNT: ${{ steps.base.outputs.count }}
