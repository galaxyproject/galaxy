name: Main tool tests
on:
  push:
    paths-ignore:
      - 'client/**'
      - 'doc/**'
      - 'lib/galaxy_test/selenium/**'
      - 'packages/**'
  pull_request:
    paths-ignore:
      - 'client/**'
      - 'doc/**'
      - 'lib/galaxy_test/selenium/**'
      - 'packages/**'
env:
  GALAXY_TEST_DBURI: 'postgresql+psycopg://postgres:postgres@localhost:5432/galaxy?client_encoding=utf8'
  GALAXY_TEST_RAISE_EXCEPTION_ON_HISTORYLESS_HDA: '1'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python
        run: uv python install
      - name: Run tests
        run: ./run_tests.sh --coverage --main_tools
        working-directory: 'galaxy root'
      - uses: codecov/codecov-action@v7.0.0
        with:
          flags: main-tools
          working-directory: 'galaxy root'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Main tool test results (${{ matrix.python-version }})
          path: 'galaxy root/run_framework_tests.html'
