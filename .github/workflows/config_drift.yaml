name: Generated config files
on:
  push:
    paths-ignore:
      - 'client/**'
      - 'lib/galaxy_test/selenium/**'
      - 'packages/**'
  pull_request:
    paths-ignore:
      - 'client/**'
      - 'lib/galaxy_test/selenium/**'
      - 'packages/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: 'galaxy root'
permissions: {}
jobs:
  check:
    name: Check generated config files are up to date
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: ./scripts/common_startup.sh --dev-wheels --skip-client-build
      - name: Rebuild config files
        run: make config-rebuild
      - name: Diff...
        run: git diff
      - name: Check for changes
        run: |
          if [[ `git status --porcelain` ]]; then
            echo "Rebuilding the generated config files resulted in changes, run 'make config-rebuild' and commit results"
            exit 1
          fi
