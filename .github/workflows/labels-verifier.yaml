name: Labels Verifier
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [closed]
permissions: {}
jobs:
  check-pr-labels:
    name: Check PR labels on merge
    if: github.repository_owner == 'galaxyproject' && github.event.pull_request.merged == true
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check PR labels on merge
        if: |
          ! contains(join(github.event.pull_request.labels.*.name, ', '), 'kind/') &&
          ! contains(github.event.pull_request.labels.*.name, 'merge') &&
          ! contains(github.event.pull_request.labels.*.name, 'minor')
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'This PR was merged without a "kind/" label, please correct.',
            })
  update-milestone:
    if: github.repository_owner == 'galaxyproject' && github.event.pull_request.merged == true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Update PR milestone on merge
        uses: actions/github-script@v9
        with:
          script: |
            const targetBranch = process.env.GITHUB_BASE_REF;
            const prNumber = context.issue.number;
            // Get all open milestones
            const { data: milestones } = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (milestones.length === 0) {
              core.setFailed('No open milestones found.');
              return;
            }

            const parseVersion = (s) => {
              const match = /^(\d+)\.(\d+)$/.exec(s);
              return match ? [Number(match[1]), Number(match[2])] : null;
            };
            const compareVersions = (a, b) => a[0] - b[0] || a[1] - b[1];
            // Open release milestones, oldest version first
            const versionedMilestones = milestones
              .map((milestone) => ({ milestone, version: parseVersion(milestone.title) }))
              .filter(({ version }) => version)
              .sort((a, b) => compareVersions(a.version, b.version));
            // Every merged pull request should be assigned to the milestone
            // corresponding to the Galaxy release it will first appear in, see:
            // https://github.com/galaxyproject/galaxy/blob/dev/doc/source/project/issues.rst
            // That is the oldest open milestone at or above the minimum version.
            let minVersion = null;
            if (targetBranch === 'dev') {
              // dev feeds the oldest release that has no release branch yet
              const { data: refs } = await github.rest.git.listMatchingRefs({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/release_',
              });
              const branchVersions = refs
                .map((ref) => parseVersion(ref.ref.replace('refs/heads/release_', '')))
                .filter((version) => version)
                .sort(compareVersions);
              const newestBranch = branchVersions[branchVersions.length - 1];
              minVersion = newestBranch ? [newestBranch[0], newestBranch[1] + 1] : [0, 0];
            } else if (/^release_\d+\.\d+$/.test(targetBranch)) {
              minVersion = parseVersion(targetBranch.replace('release_', ''));
            }
            const targetMilestone = minVersion
              ? versionedMilestones.find(({ version }) => compareVersions(version, minVersion) >= 0)?.milestone
              : null;

            // Update the Pull Request with the selected milestone
            if (targetMilestone) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                milestone: targetMilestone.number
              });
              console.log(`Successfully updated PR #${prNumber} to milestone: "${targetMilestone.title}"`);
            } else {
              console.log('Target branch did not match routing rules. No milestone updated.');
            }
