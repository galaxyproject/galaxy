name: Update dependencies
on:
  schedule:
    - cron: '0 3 * * 6'  # Run every saturday at 3 am.
  workflow_dispatch:
permissions: {}
jobs:
  update_dependencies:
    name: Update dependencies
    if: github.repository_owner == 'galaxyproject'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: .tool-versions
          python-version: '3.10'
      - name: Update dependencies
        run: make update-dependencies
      - name: Verify regenerated requirements match the lock
        # update.sh supports UV_CHECK=1 (uv lock --check + export --frozen into
        # a temp dir diffed against the committed files). Running it right after
        # the update guarantees the pull request only contains self-consistent
        # artifacts; it fails if any export was not regenerated.
        run: UV_CHECK=1 bash packages/app/src/galaxy/dependencies/update.sh
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          author: galaxybot <galaxybot@users.noreply.github.com>
          token: ${{ secrets.GALAXYBOT_PAT }}
          commit-message: |
            Update Python dependencies

            by running `make update-dependencies`.
          branch: dev_auto_update_dependencies
          delete-branch: true
          push-to-fork: galaxybot/galaxy
          title: Update Python dependencies
          body: by running `make update-dependencies`.
          labels: |
            area/dependencies
            kind/enhancement
