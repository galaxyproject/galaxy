name: Publish release artifacts
on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'create release or prerelease artifact ?'
        required: true
        default: 'prerelease'
        type: choice
        options:
        - release
        - prerelease
      release_tag:
        description: 'Specify tag to build for'
        required: true
        type: string
jobs:
  check-permissions:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check if user can create releases
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          if [[ "$PERMISSION" != "admin" ]]; then
            echo "Error: Only repository admins can manually trigger release artifacts"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-python-packages:
    if: |
      github.repository_owner == 'galaxyproject' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && !cancelled() && !failure()))
    needs: [check-permissions]
    name: Build Python packages for PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install script dependencies
        run: uv tool install galaxy-release-util
      - name: Build Python packages
        run: |
          galaxy-release-util build
      - name: Move all built packages to dist/
        run: |
          mkdir -p dist
          for dir in $(find packages/ -mindepth 2 -maxdepth 2 -type d -name dist); do
              mv ${dir}/* dist/
          done
          ls dist/
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/

  pypi-publish:
    if: always() && needs.build-python-packages.result == 'success'
    needs: [build-python-packages]
    name: Upload packages to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_type == 'prerelease') || (github.event_name == 'release' && github.event.release.prerelease) && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  build-and-publish-npm:
    if: |
      github.repository_owner == 'galaxyproject' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && !cancelled() && !failure()))
    needs: [check-permissions]
    name: Build and Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          persist-credentials: false
      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat client/.node_version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          registry-url: 'https://registry.npmjs.org'
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: build client
        run: pnpm install && pnpm build-production
        working-directory: 'client'
      # Ensure npm 11.5.1 or later for trusted publishing
      - run: npm install -g npm@latest
        working-directory: 'client'
      - name: publish client
        if: (github.event_name == 'workflow_dispatch' && inputs.release_type == 'release') || (github.event_name == 'release' && !github.event.release.prerelease)
        run: npm publish --provenance --access public
        working-directory: 'client'
      - name: sync client-api version
        run: npm run sync-version
        working-directory: 'client-api'
      - name: build client-api
        run: pnpm install && pnpm run build
        working-directory: 'client-api'
      - name: publish client-api
        if: (github.event_name == 'workflow_dispatch' && inputs.release_type == 'release') || (github.event_name == 'release' && !github.event.release.prerelease)
        run: npm publish --provenance --access public
        working-directory: 'client/packages/api-client'

  # Container publishing
  check-container-version:
    name: Check if container should be built
    runs-on: ubuntu-latest
    needs: [check-permissions]
    if: |
      github.repository_owner == 'galaxyproject' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && !cancelled() && !failure()))
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      version: ${{ steps.decision.outputs.version }}
      tag_name: ${{ steps.decision.outputs.tag_name }}
      is_prerelease: ${{ steps.decision.outputs.is_prerelease }}
    steps:
      - name: Determine if container should be built
        id: decision
        run: |
          should_build="true"
          is_prerelease="false"

          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag_name="${{ github.event.release.tag_name }}"
            is_prerelease="${{ github.event.release.prerelease }}"
          else
            tag_name="${{ inputs.release_tag }}"
            is_prerelease="${{ inputs.release_type == 'prerelease' }}"
          fi

          version=${tag_name#v}  # Remove 'v' prefix
          echo "Release build: $tag_name (version: $version, prerelease: $is_prerelease)"

          # Check if Docker images already exist for this version
          echo "Checking if release artifacts already exist for version $version..."
          if docker manifest inspect quay.io/galaxyproject/galaxy-min:$version >/dev/null 2>&1; then
            echo "Docker image quay.io/galaxyproject/galaxy-min:$version already exists"
            should_build="false"
            echo "::notice::Release $tag_name containers already exist. Skipping duplicate build."
          elif docker manifest inspect galaxy/galaxy-min:$version >/dev/null 2>&1; then
            echo "Docker image galaxy/galaxy-min:$version already exists"
            should_build="false"
            echo "::notice::Release $tag_name containers already exist. Skipping duplicate build."
          else
            echo "Docker images do not exist for version $version"
            echo "Proceeding with release container build for version $version"
          fi

          echo "should_build=$should_build" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          echo "is_prerelease=$is_prerelease" >> $GITHUB_OUTPUT

  build-test-container:
    name: Build and test release container
    needs: check-container-version
    if: needs.check-container-version.outputs.should_build == 'true'
    uses: ./.github/workflows/container_build_test.yml
    with:
      ref: ${{ needs.check-container-version.outputs.tag_name }}
      image_tag: ${{ needs.check-container-version.outputs.version }}

  publish-container:
    name: Publish release container
    runs-on: ubuntu-latest
    needs: [check-container-version, build-test-container]
    outputs:
      galaxy_version: ${{ needs.build-test-container.outputs.galaxy_version }}
      image_tag: ${{ needs.build-test-container.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.check-container-version.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and publish to registries
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .k8s_ci.Dockerfile
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            IMAGE_TAG=${{ needs.check-container-version.outputs.version }}
          tags: |
            galaxy/galaxy-min:${{ needs.check-container-version.outputs.version }}
            quay.io/galaxyproject/galaxy-min:${{ needs.check-container-version.outputs.version }}

  create-helm-pr:
    name: Create Helm chart PR
    runs-on: ubuntu-latest
    needs: [check-container-version, publish-container]
    if: needs.check-container-version.outputs.is_prerelease == 'false'
    outputs:
      pr_number: ${{ steps.create_pr.outputs.pull-request-number }}
      pr_url: ${{ steps.create_pr.outputs.pull-request-url }}
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HELM_UPDATER_APP_ID }}
          private-key: ${{ secrets.HELM_UPDATER_PKEY }}
          repositories: galaxy-helm

      - name: Checkout Galaxy Helm chart
        uses: actions/checkout@v6
        with:
          repository: galaxyproject/galaxy-helm
          token: ${{ steps.generate_token.outputs.token }}

      - name: Update Chart.yaml appVersion
        run: |
          echo "Updating Chart.yaml appVersion to ${{ needs.publish-container.outputs.galaxy_version }}"
          sed -i "s/^appVersion:.*/appVersion: \"${{ needs.publish-container.outputs.galaxy_version }}\"/" galaxy/Chart.yaml

      - name: Update values.yaml image.tag
        run: |
          echo "Updating values.yaml image.tag to ${{ needs.publish-container.outputs.image_tag }}"
          sed -i "s/^  tag:.*/  tag: \"${{ needs.publish-container.outputs.image_tag }}\"/" galaxy/values.yaml

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate_token.outputs.token }}
          commit-message: "Update Galaxy to version ${{ needs.publish-container.outputs.galaxy_version }}"
          title: "Update Galaxy to version ${{ needs.publish-container.outputs.galaxy_version }}"
          body: |
            This PR updates the Galaxy Helm chart to use the new Galaxy release.

            ## Changes
            - **appVersion**: `${{ needs.publish-container.outputs.galaxy_version }}`
            - **image.tag**: `${{ needs.publish-container.outputs.image_tag }}`

            ## Triggered by
            - **Repository**: ${{ github.repository }}
            - **Tag**: ${{ needs.check-container-version.outputs.tag_name }}
            - **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            🤖 This PR was automatically created by the Galaxy release workflow.
          branch: update-galaxy-${{ needs.publish-container.outputs.galaxy_version }}
          delete-branch: true
          labels: |
            patch
            automated-update

  notify-container-success:
    name: Notify container publish success
    runs-on: ubuntu-latest
    needs: [check-container-version, publish-container, create-helm-pr]
    if: always() && needs.check-container-version.outputs.should_build == 'true' && needs.publish-container.result == 'success'
    steps:
      - name: Send Slack notification for successful release
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.K8S_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rocket: *Galaxy Release Container Images Published*",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":rocket: Galaxy Release Container Images Published",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Release:*\n${{ needs.check-container-version.outputs.tag_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ needs.check-container-version.outputs.version }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Prerelease:*\n${{ needs.check-container-version.outputs.is_prerelease }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Published Images:*\n• `galaxy/galaxy-min:${{ needs.check-container-version.outputs.version }}`\n• `quay.io/galaxyproject/galaxy-min:${{ needs.check-container-version.outputs.version }}`"
                  }
                }${{ needs.create-helm-pr.outputs.pr_url && ',{"type": "section","text": {"type": "mrkdwn","text": "*Helm Chart PR:* <' || '' }}${{ needs.create-helm-pr.outputs.pr_url }}${{ needs.create-helm-pr.outputs.pr_url && '|#' || '' }}${{ needs.create-helm-pr.outputs.pr_number }}${{ needs.create-helm-pr.outputs.pr_url && '>"}}' || '' }},
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow Run",
                        "emoji": true
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }${{ needs.create-helm-pr.outputs.pr_url && ',{"type": "button", "text": {"type": "plain_text", "text": "View Helm Chart PR", "emoji": true}, "url": "' || '' }}${{ needs.create-helm-pr.outputs.pr_url }}${{ needs.create-helm-pr.outputs.pr_url && '"}' || '' }}
                  ]
                }
              ]
            }

  notify-container-skipped:
    name: Notify container build skipped
    runs-on: ubuntu-latest
    needs: check-container-version
    if: needs.check-container-version.outputs.should_build == 'false'
    steps:
      - name: Send Slack notification for skipped build
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.K8S_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":information_source: *Galaxy Container Build Skipped*",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":information_source: Galaxy Container Build Skipped",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Release *${{ needs.check-container-version.outputs.tag_name }}* container images have already been built. Skipping duplicate build."
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow Run",
                        "emoji": true
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

  notify-container-failure:
    name: Notify container publish failure
    runs-on: ubuntu-latest
    needs: [check-container-version, build-test-container, publish-container]
    if: always() && needs.check-container-version.outputs.should_build == 'true' && (needs.build-test-container.result == 'failure' || needs.publish-container.result == 'failure')
    steps:
      - name: Determine which job failed
        id: failure-info
        run: |
          if [[ "${{ needs.build-test-container.result }}" == "failure" ]]; then
            echo "failed_job=Container build or test" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.publish-container.result }}" == "failure" ]]; then
            echo "failed_job=Container publishing" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification for container failure
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.K8S_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *Galaxy Release Container Publishing Failed*",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":x: Galaxy Release Container Publishing Failed",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Release:*\n${{ needs.check-container-version.outputs.tag_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Failed Job:*\n${{ steps.failure-info.outputs.failed_job }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow Run",
                        "emoji": true
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
