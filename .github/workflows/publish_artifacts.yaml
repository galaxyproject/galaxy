name: Publish release artifacts
on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'create release or prerelease artifact ?'
        required: true
        default: 'prerelease'
        type: choice
        options:
        - release
        - prerelease
      release_tag:
        description: 'Specify tag to build for'
        required: true
        type: string
permissions: {}
jobs:
  check-permissions:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check if user can create releases
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${GITHUB_ACTOR}/permission --jq '.permission')
          if [[ "$PERMISSION" != "admin" ]]; then
            echo "Error: Only repository admins can manually trigger release artifacts"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build-python-packages:
    if: |
      github.repository_owner == 'galaxyproject' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && !cancelled() && !failure()))
    needs: [check-permissions]
    name: Build Python packages for PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
          python-version: '3.10'
      - name: Install script dependencies
        run: uv tool install galaxy-release-util
      - name: Build Python packages
        run: |
          galaxy-release-util build
      - name: Move all built packages to dist/
        run: |
          mkdir -p dist
          for dir in $(find packages/ -mindepth 2 -maxdepth 2 -type d -name dist); do
              mv ${dir}/* dist/
          done
          ls dist/
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/

  pypi-publish:
    if: always() && needs.build-python-packages.result == 'success'
    needs: [build-python-packages]
    name: Upload packages to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ ((github.event_name == 'workflow_dispatch' && inputs.release_type == 'prerelease') || (github.event_name == 'release' && github.event.release.prerelease)) && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  build-and-publish-npm:
    if: |
      github.repository_owner == 'galaxyproject' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && !cancelled() && !failure()))
    needs: [check-permissions]
    name: Build and Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          persist-credentials: false
      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat client/.node_version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      # TODO(post-26.1): the @galaxyproject/galaxy-client npm publish is now
      # redundant with the galaxy-web-client PyPI wheel used by
      # scripts/common_startup.sh and the install-client make target.  Keep
      # publishing for at least one release cycle in case external consumers
      # depend on it; once verified unused, drop the build+publish steps
      # below (leave the client-api publish intact).
      - name: build client
        run: pnpm install && pnpm build-production
        working-directory: 'client'
      # Ensure npm 11.5.1 or later for trusted publishing.  Stay on the 11.x
      # line: npm 12 requires node ^22.22.2, and client/.node_version pins
      # 22.20.0.
      - run: npm install -g npm@11
        working-directory: 'client'
      - name: publish client
        if: (github.event_name == 'workflow_dispatch' && inputs.release_type == 'release') || (github.event_name == 'release' && !github.event.release.prerelease)
        # `pnpm publish` rewrites `workspace:*` deps to real versions; `npm publish` would ship the literal protocol and break downstream installs.
        # Strip the workspace-only `postinstall` so it doesn't run in consumers' node_modules.
        run: |
          npm pkg delete scripts.postinstall
          pnpm publish --provenance --access public --no-git-checks
        working-directory: 'client'
      - name: sync client-api version
        run: npm run sync-version
        working-directory: 'client/packages/api-client'
      - name: build client-api
        run: pnpm --filter @galaxyproject/galaxy-api-client run build
        working-directory: 'client'
      - name: publish client-api
        if: (github.event_name == 'workflow_dispatch' && inputs.release_type == 'release') || (github.event_name == 'release' && !github.event.release.prerelease)
        # Publish like the client: pnpm + --no-git-checks (CI publishes from a detached
        # tag checkout with a dirty tree, which pnpm's default git checks would block).
        run: pnpm publish --provenance --access public --no-git-checks
        working-directory: 'client/packages/api-client'

  # Container publishing
  get-version:
    name: Extract version from tag
    runs-on: ubuntu-latest
    needs: [check-permissions]
    if: |
      github.repository_owner == 'galaxyproject' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && !cancelled() && !failure()))
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Extract version and tag
        id: extract
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          version=${tag#v}  # Remove 'v' prefix if present
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Tag: $tag, Version: $version"

  build-test-container:
    name: Build and test release container
    needs: [get-version]
    uses: ./.github/workflows/container_build_test.yaml
    with:
      ref: ${{ needs.get-version.outputs.tag }}
      image_tag: ${{ needs.get-version.outputs.version }}

  publish-container:
    name: Publish release container
    runs-on: ubuntu-latest
    needs: [build-test-container]
    steps:
      - name: Publish tested image
        uses: ./.github/actions/publish-container
        with:
          image_tag: ${{ needs.build-test-container.outputs.image_tag }}
          quay_username: ${{ secrets.QUAY_USERNAME }}
          quay_password: ${{ secrets.QUAY_PASSWORD }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}
