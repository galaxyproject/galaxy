name: Publish release artifacts
on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'create release or prerelease artifact ?'
        required: true
        default: 'prerelease'
        type: choice
        options:
        - release
        - prerelease
      release_tag:
        description: 'Specify tag to build for'
        required: true
        type: string
jobs:
  check-permissions:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check if user can create releases
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          if [[ "$PERMISSION" != "admin" ]]; then
            echo "Error: Only repository admins can manually trigger release artifacts"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-python-packages:
    if: |
      github.repository_owner == 'galaxyproject' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && !cancelled() && !failure()))
    needs: [check-permissions]
    name: Build Python packages for PyPI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      # The 25.1 package Makefiles call ``python -m build`` and ``twine`` from PATH.
      - name: Install script dependencies
        run: pip install galaxy-release-util build twine
      - name: Build Python packages
        run: |
          galaxy-release-util build
      - name: Move all built packages to dist/
        run: |
          mkdir -p dist
          for dir in $(find packages/ -mindepth 2 -maxdepth 2 -type d -name dist); do
              mv ${dir}/* dist/
          done
          ls dist/
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/

  pypi-publish:
    if: always() && needs.build-python-packages.result == 'success'
    needs: [build-python-packages]
    name: Upload packages to PyPI
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ ((github.event_name == 'workflow_dispatch' && inputs.release_type == 'prerelease') || (github.event_name == 'release' && github.event.release.prerelease)) && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  build-and-publish-npm:
    # Release events only: a manual dispatch for an old 25.1 tag must not move
    # the npm ``latest`` dist-tag back from a newer release.
    if: github.repository_owner == 'galaxyproject' && github.event_name == 'release'
    name: Build and Publish to NPM
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat client/.node_version)" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: 'yarn'
          cache-dependency-path: 'client/yarn.lock'
          registry-url: 'https://registry.npmjs.org'
      - name: build client
        run: yarn && yarn build-production
        working-directory: 'client'
      # Ensure npm 11.5.1 or later for trusted publishing.  Stay on the 11.x
      # line: npm 12 requires node ^22.22.2, and client/.node_version pins
      # 22.13.0.
      - run: npm install -g npm@11
        working-directory: 'client'
      - name: publish client
        if: "!github.event.release.prerelease"
        run: npm publish --provenance --access public
        working-directory: 'client'
