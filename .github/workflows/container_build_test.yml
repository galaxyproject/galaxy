name: Build and Test Container (Reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build from'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Tag to use for the built image'
        required: false
        type: string
        default: 'test'
    outputs:
      galaxy_version:
        description: 'Galaxy version from the build'
        value: ${{ jobs.build.outputs.version }}
      image_tag:
        description: 'Docker image tag used'
        value: ${{ inputs.image_tag }}
      commit_sha:
        description: 'Git commit SHA that was built'
        value: ${{ jobs.build.outputs.commit_sha }}

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit_sha: ${{ steps.commit.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set commit info
        id: commit
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get Galaxy version
        id: version
        run: |
          version=$(python3 -c "import lib.galaxy.version; print(lib.galaxy.version.VERSION)")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build args
        id: buildargs
        run: |
          echo "gitcommit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "builddate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .k8s_ci.Dockerfile
          load: true  # Load into local Docker daemon for testing
          build-args: |
            GIT_COMMIT=${{ steps.buildargs.outputs.gitcommit }}
            BUILD_DATE=${{ steps.buildargs.outputs.builddate }}
            IMAGE_TAG=${{ inputs.image_tag }}
          tags: |
            galaxy/galaxy-min:${{ inputs.image_tag }}

  smoke-test:
    name: Smoke test container
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Start k8s locally
        uses: jupyterhub/action-k3s-helm@v4
        with:
          k3s-version: v1.32.0+k3s1
          metrics-enabled: false
          traefik-enabled: false

      - name: Import image into k3s
        run: |
          # Save the image to a tar file
          docker save galaxy/galaxy-min:${{ inputs.image_tag }} > /tmp/galaxy-image.tar

          # Import into k3s
          sudo k3s ctr images import /tmp/galaxy-image.tar

          # Verify the image is available
          sudo k3s ctr images ls | grep galaxy

      - name: Verify k8s setup
        run: |
          echo "kubeconfig: $KUBECONFIG"
          kubectl version
          kubectl get pods --all-namespaces
          helm version

      - name: Add Galaxy Helm repository
        run: helm repo add galaxy https://github.com/CloudVE/helm-charts/raw/master

      - name: Install Galaxy dependencies
        run: |
          helm install galaxy-deps galaxy/galaxy-deps \
            --namespace galaxy-deps \
            --create-namespace \
            --set cvmfs.cvmfscsi.cache.alien.enabled=false \
            --wait \
            --timeout=1200s

      - name: Install Galaxy using local image
        run: |
          helm install galaxy galaxy/galaxy \
            --namespace galaxy \
            --create-namespace \
            --set persistence.accessMode="ReadWriteOnce" \
            --set resources.requests.memory=0Mi,resources.requests.cpu=0m \
            --set image.repository="galaxy/galaxy-min" \
            --set image.tag="${{ inputs.image_tag }}" \
            --set image.pullPolicy="Never" \
            --wait \
            --timeout=1200s

      - name: Debug deployment on failure
        if: failure()
        run: |
          echo "=== Deployment failed, gathering debug information ==="

          echo "=== All pods in galaxy namespace ==="
          kubectl get pods -n galaxy -o wide

          echo "=== All pods in galaxy-deps namespace ==="
          kubectl get pods -n galaxy-deps -o wide

          echo "=== Recent events in galaxy namespace ==="
          kubectl get events -n galaxy --sort-by='.lastTimestamp' | tail -50

          echo "=== Recent events in galaxy-deps namespace ==="
          kubectl get events -n galaxy-deps --sort-by='.lastTimestamp' | tail -50

          echo "=== Describe failed pods in galaxy namespace ==="
          for pod in $(kubectl get pods -n galaxy --field-selector=status.phase!=Running,status.phase!=Succeeded -o name 2>/dev/null); do
            echo "--- Describing $pod ---"
            kubectl describe -n galaxy $pod
          done

      - name: Verify Galaxy API
        run: |
          kubectl get svc -n galaxy
          address=$(kubectl get svc -n galaxy galaxy-nginx -o jsonpath="http://{.spec.clusterIP}:{.spec.ports[0].port}/galaxy/api/version")
          echo "Testing Galaxy API at: $address"

          expected_version=${{ needs.build.outputs.version }}
          api_version=$(curl -s $address | jq -r '"\(.version_major).\(.version_minor)"')

          echo "Expected version: $expected_version"
          echo "API version: $api_version"

          if [ "$expected_version" != "$api_version" ]; then
            echo "❌ Version mismatch!"
            exit 1
          fi

          echo "✅ API version verified"

      - name: Verify client build
        run: |
          base_url=$(kubectl get svc -n galaxy galaxy-nginx -o jsonpath="http://{.spec.clusterIP}:{.spec.ports[0].port}")
          css_url="${base_url}/galaxy/static/dist/base.css"
          echo "Checking client build at: $css_url"

          status_code=$(curl -s -o /dev/null -w "%{http_code}" "$css_url")
          echo "Status code: $status_code"

          if [ "$status_code" != "200" ]; then
            echo "❌ Client build not properly served (status: $status_code)"
            exit 1
          fi

          echo "✅ Client build verified"