name: macOS startup
on:
  push:
    paths:
      - '**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/osx_startup.yaml'
      - '.github/workflows/_build_client.yaml'
  pull_request:
    paths:
      - '**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/osx_startup.yaml'
      - '.github/workflows/_build_client.yaml'
env:
  UV_HTTP_RETRIES: '6'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  build-client:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    uses: $/.github/workflows/_build_client.yaml
  test:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    name: Startup test
    runs-on: macos-latest
    needs: build-client
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Install miniforge  # use this job to test using Python from a conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ''
      - name: Restore client cache
        uses: actions/cache@v6.1.0
        id: client-cache
        with:
          key: galaxy-static-${{ needs.build-client.outputs.commit-id }}
          path: 'galaxy root/static'
      - name: Set up Node.js to rebuild the client
        if: steps.client-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: 'galaxy root/client/.node_version'
      - name: Set up pnpm to rebuild the client
        if: steps.client-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'galaxy root/client/package.json'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: galaxy root/.tool-versions
          prune-cache: true
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Run tests
        run: tox -e first_startup
        working-directory: 'galaxy root'
        env:
          GALAXY_CONDA_PYTHON_VERSION: "${{ matrix.python-version }}"
          NODE_OPTIONS: --max-old-space-size=4096
