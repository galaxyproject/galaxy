name: macOS startup
on:
  push:
    paths-ignore:
      - 'doc/**'
      - 'lib/galaxy_test/selenium/**'
      - 'packages/**'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'lib/galaxy_test/selenium/**'
      - 'packages/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-client:
    uses: ./.github/workflows/build_client.yaml
  test:
    name: Startup test
    runs-on: macos-latest
    needs: build-client
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Install miniforge  # use this job to test using Python from a conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ''
      - name: Restore client cache
        uses: actions/cache@v5
        id: client-cache
        with:
          key: galaxy-static-${{ needs.build-client.outputs.commit-id }}
          path: 'galaxy root/static'
      - name: Set up Node.js to rebuild the client
        if: steps.client-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: 'galaxy root/client/.node_version'
      - name: Set up pnpm to rebuild the client
        if: steps.client-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: 'galaxy root/package.json'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Run tests
        run: tox -e first_startup
        working-directory: 'galaxy root'
        env:
          GALAXY_CONDA_PYTHON_VERSION: "${{ matrix.python-version }}"
