name: first startup
on:
  push:
    paths-ignore:
      - 'doc/**'
      - 'lib/galaxy_test/selenium/**'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'lib/galaxy_test/selenium/**'
env:
  YARN_INSTALL_OPTS: --frozen-lockfile
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-client:
    uses: ./.github/workflows/build_client.yaml
  test:
    name: Startup test
    needs: build-client
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Get full Python version
        id: full-python-version
        shell: bash
        run: echo "version=$(python -c 'import sys; print("-".join(str(v) for v in sys.version_info))')" >> $GITHUB_OUTPUT
      - name: Restore client cache
        uses: actions/cache@v5
        with:
          fail-on-cache-miss: true
          key: galaxy-static-${{ needs.build-client.outputs.commit-id }}
          path: 'galaxy root/static'
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: run tests
        run: tox -e first_startup
        working-directory: 'galaxy root'
  installed-test:
    name: Installed startup test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install release tooling
        run: uv tool install galaxy-release-util==0.4.2
      - name: Build and install Galaxy packages
        run: make install-packages VENV="$RUNNER_TEMP/galaxy-installed"
        working-directory: 'galaxy root'
      - name: Start installed Galaxy
        run: .ci/installed_startup.sh "$RUNNER_TEMP/galaxy-installed"
        working-directory: 'galaxy root'
