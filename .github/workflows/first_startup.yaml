name: first startup
on:
  push:
    paths:
      - '**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/first_startup.yaml'
      - '.github/workflows/_build_client.yaml'
  pull_request:
    paths:
      - '**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/first_startup.yaml'
      - '.github/workflows/_build_client.yaml'
env:
  YARN_INSTALL_OPTS: --frozen-lockfile
  UV_HTTP_RETRIES: '6'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  build-client:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    uses: $/.github/workflows/_build_client.yaml
  test:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    name: Startup test
    needs: build-client
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: galaxy root/.tool-versions
          python-version: ${{ matrix.python-version }}
      - name: Restore client cache
        uses: actions/cache@v6.1.0
        with:
          fail-on-cache-miss: true
          key: galaxy-static-${{ needs.build-client.outputs.commit-id }}
          path: 'galaxy root/static'
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: run tests
        run: tox -e first_startup
        working-directory: 'galaxy root'
  installed-test:
    name: Installed startup test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: galaxy root/.tool-versions
      - name: Install release tooling
        run: uv tool install galaxy-release-util==0.4.2
      - name: Build and install Galaxy packages
        run: make install-packages VENV="$RUNNER_TEMP/galaxy-installed"
        working-directory: 'galaxy root'
      - name: Start installed Galaxy
        run: .ci/installed_startup.sh "$RUNNER_TEMP/galaxy-installed"
        working-directory: 'galaxy root'
