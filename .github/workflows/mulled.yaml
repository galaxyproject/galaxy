name: Mulled Unit Tests
on:
  push:
    paths:
      - '**'
      - '!client/**'
      - '!doc/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/mulled.yaml'
  pull_request:
    paths:
      - '**'
      - '!client/**'
      - '!doc/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/mulled.yaml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: galaxy root/.tool-versions
          python-version: ${{ matrix.python-version }}
      - name: Install Apptainer's singularity
        uses: './galaxy root/.github/actions/install_apptainer'
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Run tests
        run: tox -e mulled
        working-directory: 'galaxy root'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Mulled unit test results (${{ matrix.python-version }})
          path: 'galaxy root/run_unit_tests.html'
