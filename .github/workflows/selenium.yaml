name: Selenium tests
on:
  schedule:
    # Run at midnight UTC every Tuesday
    - cron: '0 0 * * 2'
  workflow_dispatch:
env:
  GALAXY_CONFIG_GALAXY_URL_PREFIX: '/galaxypf'
  GALAXY_TEST_DBURI: 'postgresql+psycopg://postgres:postgres@localhost:5432/galaxy?client_encoding=utf8'
  GALAXY_TEST_RAISE_EXCEPTION_ON_HISTORYLESS_HDA: '1'
  GALAXY_TEST_SELENIUM_RETRIES: 1
  GALAXY_TEST_SKIP_FLAKEY_TESTS_ON_ERROR: 1
  YARN_INSTALL_OPTS: --frozen-lockfile
  GALAXY_CONFIG_SQLALCHEMY_WARN_20: '1'
  GALAXY_CONFIG_OVERRIDE_METADATA_STRATEGY: extended
  GALAXY_CONFIG_OVERRIDE_OUTPUTS_TO_WORKING_DIRECTORY: 'true'
  UV_HTTP_RETRIES: '6'
permissions: {}
jobs:
  build-client:
    uses: $/.github/workflows/_build_client.yaml
  test:
    name: Test
    needs: [build-client]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        chunk: [0, 1]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python
        run: uv python install
      - name: Restore client cache
        uses: actions/cache@v6.1.0
        with:
          fail-on-cache-miss: true
          key: galaxy-static-${{ needs.build-client.outputs.commit-id }}
          path: 'galaxy root/static'
      - name: Run tests
        run: ./run_tests.sh --coverage -selenium packages/test_selenium/src/galaxy_test/selenium -- --num-shards=2 --shard-id=${{ matrix.chunk }} -n 3 --dist loadscope
        working-directory: 'galaxy root'
      - uses: codecov/codecov-action@v7.1.1
        with:
          flags: selenium
          working-directory: 'galaxy root'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Selenium test results (${{ matrix.python-version }}, ${{ matrix.chunk }})
          path: 'galaxy root/run_selenium_tests.html'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Selenium debug info (${{ matrix.python-version }}, ${{ matrix.chunk }})
          path: 'galaxy root/database/test_errors'
  report:
    needs: [build-client, test]
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      issues: write
    uses: $/.github/workflows/_report_scheduled_result.yaml
    with:
      title: Scheduled Selenium tests are failing
      labels: area/testing/selenium, kind/bug
      description: |-
        The weekly run of `packages/test_selenium/src/galaxy_test/selenium` on the Selenium backend failed.

        Pull requests run these tests under Playwright only, so this run is the only CI coverage of the Selenium backend and of tests marked `@selenium_only`.
      needs: ${{ toJSON(needs) }}
