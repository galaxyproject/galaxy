name: Database indexes
on:
  push:
    paths:
      - '**'
      - '!client/**'
      - '!doc/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/db_indexes.yaml'
  pull_request:
    paths:
      - '**'
      - '!client/**'
      - '!doc/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/db_indexes.yaml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: 'galaxy root'
permissions: {}
jobs:
  check:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    name: Check database indexes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: ['postgresql']
        postgresql-version: ['9.6', '10', '11', '14', '18']
        python-version: ['3.10']
        include:
          - db: sqlite
            python-version: '3.10'
    services:
      postgres:
        image: ${{ matrix.db == 'postgresql' && format('postgres:{0}', matrix.postgresql-version) || '' }}  # zizmor: ignore[unpinned-images]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: galaxy root/.uv-version
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Set database connection on PostgreSQL
        if: matrix.db == 'postgresql'
        run: echo 'GALAXY_CONFIG_OVERRIDE_DATABASE_CONNECTION=postgresql+psycopg://postgres:postgres@localhost:5432/galaxy?client_encoding=utf8' >> $GITHUB_ENV
      - name: Check indexes
        run: tox -e check_indexes
