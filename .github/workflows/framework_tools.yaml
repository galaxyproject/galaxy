name: Tool framework tests
on:
  push:
    paths:
      - '**'
      - '!client/**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/framework_tools.yaml'
      - '.github/workflows/_report_scheduled_result.yaml'
  pull_request:
    paths:
      - '**'
      - '!client/**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/framework_tools.yaml'
      - '.github/workflows/_report_scheduled_result.yaml'
  schedule:
    # Run at midnight UTC every Tuesday, with extended metadata; this cron string is also matched below.
    - cron: '0 0 * * 2'
  workflow_call:
    inputs:
      target-branch:
        description: Branch being tested by the nightly dispatcher.
        type: string
        default: ''
      target-sha:
        description: Resolved commit to test and include in failure reports.
        type: string
        default: ''
      python-version:
        description: The single Python version configured for this branch.
        type: string
        default: ''
      postgres-version:
        type: string
        default: '18'
      postgres-driver:
        type: string
        default: 'psycopg'
      framework-api-versions:
        description: JSON array of tool API modes supported by the target branch.
        type: string
        default: '["never", "always"]'
env:
  GALAXY_TEST_DBURI: "postgresql+${{ inputs.postgres-driver || 'psycopg' }}://postgres:postgres@localhost:5432/galaxy?client_encoding=utf8"
  GALAXY_TEST_RAISE_EXCEPTION_ON_HISTORYLESS_HDA: '1'
concurrency:
  # Keep direct runs and each branch nightly from cancelling each other.
  group: framework_tools-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.schedule }}-${{ inputs.target-branch || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    name: ${{ inputs.target-branch && format('Tool framework tests [{0}] ({1}, {2})', inputs.target-branch, matrix.python-version, matrix.use-legacy-api) || format('Test ({0}, {1})', matrix.python-version, matrix.use-legacy-api) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(format('["{0}"]', inputs.python-version || '3.10')) }}
        # Pull requests and pushes to dev test only the tool request API.
        # Release PRs keep both APIs until their CI policy is backported.
        use-legacy-api: >-
          ${{ fromJSON(
          inputs.target-branch && inputs.framework-api-versions
          || (github.event_name == 'schedule' || startsWith(github.base_ref || github.ref_name, 'release_'))
          && '["never", "always"]'
          || '["never"]'
          ) }}
    services:
      postgres:
        image: postgres:${{ inputs.postgres-version || '18' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
      - if: github.event.schedule == '0 0 * * 2'
        run: |
          echo "GALAXY_CONFIG_OVERRIDE_METADATA_STRATEGY=extended" >> $GITHUB_ENV
          echo "GALAXY_CONFIG_OVERRIDE_OUTPUTS_TO_WORKING_DIRECTORY=true" >> $GITHUB_ENV
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.target-branch && 'galaxyproject/galaxy' || github.repository }}
          ref: ${{ inputs.target-sha }}
          path: 'galaxy root'
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ hashFiles('galaxy root/.tool-versions') == '' && '0.12.23' || '' }}
          version-file: ${{ hashFiles('galaxy root/.tool-versions') != '' && 'galaxy root/.tool-versions' || '' }}
          python-version: ${{ matrix.python-version }}
      - name: Install Python
        run: uv python install
      - name: Run tests
        run: ./run_tests.sh --framework-tools -- -n 4
        env:
          GALAXY_TEST_USE_LEGACY_TOOL_API: ${{ matrix.use-legacy-api }}
          # Coverage slows the tests down; collect it for pushes and scheduled runs only.
          GALAXY_TEST_COVERAGE: ${{ github.event_name != 'pull_request' && '1' || '' }}
        working-directory: 'galaxy root'
      - uses: codecov/codecov-action@v7.1.1
        if: github.event_name != 'pull_request'
        with:
          override_commit: ${{ inputs.target-sha }}
          override_branch: ${{ inputs.target-branch }}
          flags: framework
          working-directory: 'galaxy root'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Tool framework test results (${{ inputs.target-branch || github.ref_name }}, ${{ matrix.python-version }}, ${{ matrix.use-legacy-api }})
          path: 'galaxy root/run_framework_tests.html'
  report:
    needs: [test]
    if: ${{ !cancelled() && inputs.target-branch != '' }}
    permissions:
      actions: read
      issues: write
    uses: $/.github/workflows/_report_scheduled_result.yaml
    with:
      title: Scheduled tool framework tests are failing (${{ inputs.target-branch }})
      labels: area/tool-framework, area/testing, kind/bug
      description: Nightly tool framework tests on `${{ inputs.target-branch }}` using Python ${{ inputs.python-version }} failed.
      needs: ${{ toJSON(needs) }}
      tested-sha: ${{ inputs.target-sha }}
      job-name-prefix: Tool framework tests [${{ inputs.target-branch }}]
