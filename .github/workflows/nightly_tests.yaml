name: Nightly compatibility tests
on:
  push:
    paths:
      - '.github/workflows/nightly_tests.yaml'
      - '.github/workflows/unit.yaml'
      - '.github/workflows/toolshed.yaml'
      - '.github/workflows/framework_tools.yaml'
      - '.github/workflows/_report_scheduled_result.yaml'
      - '.github/nightly-test-targets.json'
      - '.github/scripts/nightly-test-targets*'
  pull_request:
    paths:
      - '.github/workflows/nightly_tests.yaml'
      - '.github/workflows/unit.yaml'
      - '.github/workflows/toolshed.yaml'
      - '.github/workflows/framework_tools.yaml'
      - '.github/workflows/_report_scheduled_result.yaml'
      - '.github/nightly-test-targets.json'
      - '.github/scripts/nightly-test-targets*'
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
concurrency:
  group: nightly-${{ github.event_name }}-${{ github.event.schedule }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  targets:
    name: Resolve nightly targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test target selection and reporter isolation
        run: node --test .github/scripts/nightly-test-targets.test.cjs .github/scripts/scheduled-report.test.mjs
      - name: Resolve branch commits
        id: targets
        uses: actions/github-script@v9
        with:
          script: |
            await require('./.github/scripts/nightly-test-targets.cjs')({github, core});
  unit:
    needs: [targets]
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *')
    name: Unit (${{ matrix.branch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
      issues: write
    uses: $/.github/workflows/unit.yaml
    with:
      target-branch: ${{ matrix.branch }}
      target-sha: ${{ matrix.sha }}
      python-version: ${{ matrix.python }}
  toolshed:
    needs: [targets]
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *')
    name: Tool Shed (${{ matrix.branch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
      issues: write
    uses: $/.github/workflows/toolshed.yaml
    with:
      target-branch: ${{ matrix.branch }}
      target-sha: ${{ matrix.sha }}
      python-version: ${{ matrix.python }}
      postgres-version: ${{ matrix.postgres }}
      postgres-driver: ${{ matrix.postgres_driver }}
      toolshed-api-versions: ${{ matrix.toolshed_api }}
  framework:
    needs: [targets]
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *')
    name: Tool framework (${{ matrix.branch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
      issues: write
    uses: $/.github/workflows/framework_tools.yaml
    with:
      target-branch: ${{ matrix.branch }}
      target-sha: ${{ matrix.sha }}
      python-version: ${{ matrix.python }}
      postgres-version: ${{ matrix.postgres }}
      postgres-driver: ${{ matrix.postgres_driver }}
      framework-api-versions: ${{ matrix.framework_api }}
