name: Toolshed tests
on:
  push:
    paths:
      - '**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/toolshed.yaml'
      - '.github/workflows/_report_scheduled_result.yaml'
  pull_request:
    paths:
      - '**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/toolshed.yaml'
      - '.github/workflows/_report_scheduled_result.yaml'
  workflow_call:
    inputs:
      target-branch:
        description: Branch being tested by the nightly dispatcher.
        type: string
        default: ''
      target-sha:
        description: Resolved commit to test and include in failure reports.
        type: string
        default: ''
      python-version:
        description: The single Python version configured for this branch.
        type: string
        default: ''
      postgres-version:
        type: string
        default: '18'
      postgres-driver:
        type: string
        default: 'psycopg'
      toolshed-api-versions:
        description: JSON array of Tool Shed API versions supported by the target branch.
        type: string
        default: '["v2"]'
env:
  GALAXY_TEST_DBURI: "postgresql+${{ inputs.postgres-driver || 'psycopg' }}://postgres:postgres@localhost:5432/galaxy?client_encoding=utf8"
  TOOL_SHED_TEST_DBURI: "postgresql+${{ inputs.postgres-driver || 'psycopg' }}://postgres:postgres@localhost:5432/toolshed?client_encoding=utf8"
concurrency:
  # Keep pushes to dev from cancelling the scheduled run.
  group: toolshed-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.target-branch || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    name: ${{ inputs.target-branch && format('Tool Shed tests [{0}] ({1}, {2}, {3})', inputs.target-branch, matrix.python-version, matrix.test-install-client, matrix.shed-api) || format('Test ({0}, {1})', matrix.python-version, matrix.test-install-client) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull requests and pushes to dev run only the newest Python; ruff and mypy catch most code too new for the oldest.
        # Release PRs keep both endpoints until their CI policy is backported.
        python-version: >-
          ${{ fromJSON(
          inputs.python-version && format('["{0}"]', inputs.python-version)
          || startsWith(github.base_ref || github.ref_name, 'release_') && '["3.10", "3.14"]'
          || '["3.14"]'
          ) }}
        test-install-client: ['galaxy_api', 'standalone']
        shed-api: ${{ fromJSON(inputs.toolshed-api-versions || '["v2"]') }}
    services:
      postgres:
        image: postgres:${{ inputs.postgres-version || '18' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.target-branch && 'galaxyproject/galaxy' || github.repository }}
          ref: ${{ inputs.target-sha }}
          path: 'galaxy root'
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ hashFiles('galaxy root/.tool-versions') == '' && '0.12.23' || '' }}
          version-file: ${{ hashFiles('galaxy root/.tool-versions') != '' && 'galaxy root/.tool-versions' || '' }}
          python-version: ${{ matrix.python-version }}
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: ./scripts/common_startup.sh --dev-wheels --skip-client-build
        working-directory: 'galaxy root'
      - name: Read Node.js version
        id: node-version
        run: |
          version_file='galaxy root/lib/tool_shed/webapp/frontend/.node_version'
          # Older releases predate this file; use the Node 22 baseline there.
          node_version=22.20.0
          if [ -f "$version_file" ]; then node_version=$(cat "$version_file"); fi
          echo "version=$node_version" >> "$GITHUB_OUTPUT"
      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'galaxy root/lib/tool_shed/webapp/frontend/package.json'
      - name: Build Frontend
        run: |
          . .venv/bin/activate
          cd lib/tool_shed/webapp/frontend
          pnpm install --frozen-lockfile
          make client
        working-directory: 'galaxy root'
      - name: Install playwright
        run: |
          . .venv/bin/activate
          playwright install
        working-directory: 'galaxy root'
      - name: Run tests
        run: ./run_tests.sh -toolshed ./lib/tool_shed/test/functional -- -n 3 --dist loadscope
        env:
          TOOL_SHED_TEST_INSTALL_CLIENT: ${{ matrix.test-install-client }}
          TOOL_SHED_API_VERSION: ${{ matrix.shed-api }}
          TOOL_SHED_TEST_BROWSER: ${{ matrix.shed-api == 'v1' && 'twill' || 'playwright' }}
        working-directory: 'galaxy root'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Toolshed test results (${{ inputs.target-branch || github.ref_name }}, ${{ matrix.python-version }}, ${{ matrix.test-install-client }}, ${{ matrix.shed-api }})
          path: 'galaxy root/run_toolshed_tests.html'
  report:
    needs: [test]
    if: ${{ !cancelled() && inputs.target-branch != '' }}
    permissions:
      actions: read
      issues: write
    uses: $/.github/workflows/_report_scheduled_result.yaml
    with:
      title: Scheduled Tool Shed tests are failing (${{ inputs.target-branch }})
      labels: area/toolshed, area/testing, kind/bug
      description: Nightly Tool Shed tests on `${{ inputs.target-branch }}` using Python ${{ inputs.python-version }} failed.
      needs: ${{ toJSON(needs) }}
      tested-sha: ${{ inputs.target-sha }}
      job-name-prefix: Tool Shed tests [${{ inputs.target-branch }}]
