name: Toolshed tests
on:
  push:
    paths:
      - '**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/toolshed.yaml'
  pull_request:
    paths:
      - '**'
      - '!doc/**'
      - '!lib/galaxy_test/selenium/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/toolshed.yaml'
  schedule:
    # Run every supported Python version at 01:00 UTC daily
    - cron: '0 1 * * *'
  workflow_dispatch:
env:
  GALAXY_TEST_DBURI: 'postgresql+psycopg://postgres:postgres@localhost:5432/galaxy?client_encoding=utf8'
  TOOL_SHED_TEST_DBURI: 'postgresql+psycopg://postgres:postgres@localhost:5432/toolshed?client_encoding=utf8'
concurrency:
  # Keep pushes to dev from cancelling the scheduled run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull requests and pushes to dev run only the newest Python; ruff and mypy catch most code too new for the oldest.
        # Release branches get no nightly run, so they keep every version.
        python-version: >-
          ${{ fromJSON(
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.base_ref || github.ref_name, 'release_'))
          && '["3.10", "3.11", "3.12", "3.13", "3.14"]'
          || '["3.14"]'
          ) }}
        test-install-client: ['galaxy_api', 'standalone']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: galaxy root/.tool-versions
          python-version: ${{ matrix.python-version }}
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: ./scripts/common_startup.sh --dev-wheels --skip-client-build
        working-directory: 'galaxy root'
      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat 'galaxy root/lib/tool_shed/webapp/frontend/.node_version')" >> $GITHUB_OUTPUT
      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'galaxy root/lib/tool_shed/webapp/frontend/package.json'
      - name: Build Frontend
        run: |
          . .venv/bin/activate
          cd lib/tool_shed/webapp/frontend
          pnpm install --frozen-lockfile
          make client
        working-directory: 'galaxy root'
      - name: Install playwright
        run: |
          . .venv/bin/activate
          playwright install
        working-directory: 'galaxy root'
      - name: Run tests
        run: ./run_tests.sh -toolshed ./lib/tool_shed/test/functional -- -n 3 --dist loadscope
        env:
          TOOL_SHED_TEST_INSTALL_CLIENT: ${{ matrix.test-install-client }}
        working-directory: 'galaxy root'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Toolshed test results (${{ matrix.python-version }}, ${{ matrix.test-install-client }})
          path: 'galaxy root/run_toolshed_tests.html'
  report:
    needs: [test]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    permissions:
      actions: read
      issues: write
    uses: $/.github/workflows/_report_scheduled_result.yaml
    with:
      title: Scheduled Tool Shed tests are failing
      labels: area/toolshed, kind/bug
      description: |-
        The nightly run of the Tool Shed tests across every supported Python version failed.

        Pull requests run the Tool Shed tests on the newest Python only, so this run is the only Tool Shed test coverage of the older versions.
      needs: ${{ toJSON(needs) }}
