name: BioBlend Tests
on:
  pull_request:
    paths:
      - .github/workflows/bioblend.yaml
      - scripts/test_bioblend.py
      - packages/schema/src/galaxy/schema/**
      - packages/web_apps/src/galaxy/webapps/galaxy/api/**
      - packages/web_apps/src/galaxy/webapps/galaxy/services/**
  workflow_dispatch:

env:
  UV_HTTP_RETRIES: '6'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        tox_env: [py314]
        galaxy_python_version: ['3.10']
    steps:
      - name: Checkout Galaxy
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          path: galaxy
          persist-credentials: false
      - name: Checkout Bioblend
        uses: actions/checkout@v7.0.1
        with:
          repository: galaxyproject/bioblend
          path: bioblend
          persist-credentials: false
      - name: Calculate Python version for BioBlend from tox_env
        id: get_bioblend_python_version
        run: echo "bioblend_python_version=$(echo "${{ matrix.tox_env }}" | sed -e 's/^py\([3-9]\)\([0-9]\+\)/\1.\2/')" >> $GITHUB_OUTPUT
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version-file: galaxy/.tool-versions
      - name: Install tox
        run: uv tool install --python ${BIOBLEND_PYTHON_VERSION} tox --with tox-uv
        env:
          BIOBLEND_PYTHON_VERSION: ${{ steps.get_bioblend_python_version.outputs.bioblend_python_version }}
      - name: Set up Python for Galaxy
        run: uv python install ${{ matrix.galaxy_python_version }}
      - name: Install Galaxy workspace
        run: uv sync --locked --package galaxy-web-apps --all-extras --python ${{ matrix.galaxy_python_version }}
        working-directory: galaxy
      - name: Run tests
        env:
          PGPASSWORD: postgres
          PGPORT: 5432
          PGHOST: localhost
        run: |
          # Create a PostgreSQL database for Galaxy. The default SQLite3 database makes test fail randomly because of "database locked" error.
          createdb -U postgres galaxy
          export DATABASE_CONNECTION=postgresql+psycopg://postgres:@localhost/galaxy
          galaxy/.venv/bin/python galaxy/scripts/test_bioblend.py bioblend ${{ matrix.tox_env }}
